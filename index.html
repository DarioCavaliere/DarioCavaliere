  "r-polpettine-verde":["Mix the beef with the egg, Parmigiano, breadcrumbs and salt, and roll into small meatballs.","Brown them in a little oil in a pan for 8 to 10 minutes, turning, until cooked through.","Blend the parsley, capers, anchovies, vinegar and the rest of the oil into a bright green sauce.","Spoon the sauce over the warm meatballs and serve."],
  "r-orata-maionese":["Score the skin of the fish lightly and pat the fillets very dry, so the skin crisps.","Heat the oil in a frying pan until shimmering and lay the fillets in skin side down, pressing them gently for the first few seconds so they don't curl. Cook for about 4 minutes, then flip and cook for 1 minute more.","Mix the mayonnaise with the mashed anchovies, chili and lemon juice.","Serve the fish skin side up with a spoonful of the sauce."],
  "r-risotto-hokkaido":["Cook the diced pumpkin in a little of the stock until soft, then blend it into a smooth cream.","Melt half the butter and sweat the sliced leek gently for 5 minutes, then add the rice, toast it for 2 minutes and pour in the wine.","Add the hot stock a ladle at a time, stirring often, for about 15 minutes, then stir in the pumpkin cream and cook for 2 to 3 minutes more.","Take it off the heat and beat in the rest of the butter and the Parmigiano. Rest for a minute before serving."]
});

/* touch feedback while turning a dial: a light tap on every step, a firmer one at either end.

let hapticSwitch = null;
function haptic(strong){

    hapticSwitch.innerHTML = '<input type="checkbox" switch tabindex="-1">';
    hapticSwitch.addEventListener("click", e => e.stopPropagation());

function initDial(k){

  const set = v => {

    v = Math.round(Math.min(d.max, Math.max(d.min, v)) / d.step) * d.step;
    if (v !== state.dial[k]) { state.dial[k] = v; paintDial(k); dialTick(k, v === d.min || v === d.max); }
    paintDialResults();

    if (e.key in map){ e.preventDefault(); set(state.dial[k] + map[e.key]); }

document.addEventListener("click", e => { const b = e.target.closest("[data-fav]"); if (b){ e.preventDefault(); toggleFav(b.dataset.fav); } });

const menuBtn = document.getElementById("menuBtn"), menuPanel = document.getElementById("menuPanel");
function renderMenu(){
  if (!menuPanel) return;
  const all = allRecipes(), favList = [...prefs.favs].map(id => all.find(r => r.id === id)).filter(Boolean);
  const acct = me && me.id
    ? `<div class="m-acct"><img src="${esc(me.avatarUrl)}" alt="" width="40" height="40"><div><b>${esc(me.name || "Signed in")}</b><small>Signed in with your Claude account. Your favourites follow you to other devices.</small></div></div>`
    : `<div class="m-acct"><span class="m-avatar">${ICON.user}</span><div><b>Browsing as a guest</b><small>Sign in to Claude to log in here. Until then, favourites are saved in this browser only.</small></div></div>`;
  menuPanel.innerHTML = `
    <section class="m-sec"><h2 class="m-h">Account</h2>${acct}</section>
    <section class="m-sec"><div class="m-row"><h2 class="m-h">Favourites</h2><span class="m-count">${favList.length}</span></div>
      ${favList.length ? `<ul class="m-list">${favList.slice(0, 6).map(r => `<li><a href="${recipeHref(r)}">${dishArt(r, "m-thumb")}<span>${esc(r.title)}</span></a></li>`).join("")}</ul><a class="m-more" href="#saved">${favList.length > 6 ? `See all ${favList.length} favourites` : "Open favourites"}</a>` : `<p class="m-empty">Tap the heart on any recipe to save it here.</p>`}
    </section>
    <section class="m-sec"><div class="m-row"><h2 class="m-h">Recent searches</h2>${prefs.searches.length ? `<button class="linkish" type="button" id="clearSearches">Clear</button>` : ""}</div>
      ${prefs.searches.length ? `<div class="m-chips">${prefs.searches.map(s => `<button class="chip" type="button" data-search="${esc(s)}">${esc(s)}</button>`).join("")}</div>` : `<p class="m-empty">Your searches will show up here.</p>`}
    </section>`;
}
function setMenu(open){
  menuPanel.hidden = !open; menuBtn.setAttribute("aria-expanded", open);
  if (open){ renderMenu(); const f = menuPanel.querySelector("a,button"); if (f) f.focus(); }
}
menuBtn.addEventListener("click", () => setMenu(menuPanel.hidden));
document.addEventListener("click", e => { if (!menuPanel.hidden && !e.composedPath().includes(menuPanel) && !e.composedPath().includes(menuBtn)) setMenu(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !menuPanel.hidden){ setMenu(false); menuBtn.focus(); } });
menuPanel.addEventListener("click", e => {
  const s = e.target.closest("[data-search]");
  if (s){ state.q = s.dataset.search; document.getElementById("q").value = state.q; setMenu(false); if (location.hash.slice(1)) location.hash = ""; else renderHome(); return; }
  if (e.target.id === "clearSearches"){ prefs.searches = []; savePrefs(); renderMenu(); return; }
  if (e.target.closest("a")) setMenu(false);
});
function renderSaved(){
  const all = allRecipes(), list = [...prefs.favs].map(id => all.find(r => r.id === id)).filter(Boolean);
  view.innerHTML = `
    <a class="btn ghost back" href="#">← All recipes</a>
    <section class="look-intro">
      <span class="eyebrow">Favourites</span>
      <h2>Your saved recipes</h2>
      <p>${me && me.id ? "Saved to your account, so they follow you to other devices." : "Saved in this browser. Sign in to Claude to keep them on every device."}</p>
    </section>
    <div class="grid">${list.length ? list.map(cardHTML).join("") : `<div class="empty">Nothing saved yet. Tap the heart on any recipe to keep it here.</div>`}</div>`;
  window.scrollTo(0, 0);
}

/* light / dark switch: remembers the choice in this browser */
(() => {
  const btn = document.getElementById("themeBtn"), root = document.documentElement;
  const SUN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>`;
  const MOON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.6A8.2 8.2 0 0 1 9.4 4a8.2 8.2 0 1 0 10.6 10.6z"/></svg>`;
  const current = () => root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const paint = () => { const dark = current() === "dark"; btn.innerHTML = dark ? SUN : MOON; btn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode"); };
  try { const saved = localStorage.getItem("dado-theme"); if (saved === "dark" || saved === "light") root.setAttribute("data-theme", saved); } catch {}
  btn.addEventListener("click", () => {
    const next = current() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("dado-theme", next); } catch {}
    paint();
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paint);
  paint();
})();

/* Method written as a walk-through: an intro, friendly lead-ins between steps, and a closing note. Built only from the recipe's own facts. */
function methodHTML(r){
  const steps = (r.steps || []).filter(Boolean), n = steps.length;
  const sweet = r.category === "Desserts" || r.category === "Baking";
  const hasLead = s => /^(meanwhile|while|once|when|after|before|if|in a|in the|on |at |for |as |off the heat|to |now|then|finally|next|first|start|repeat|reheat|serve|bring the|cover and|leave)/i.test(s);
  const fillers = ["Next, ", "Then ", "After that, ", "Now "];
  const lower = s => /^[A-Z][a-z]/.test(s) && !/^(I |Parmigiano|Thai|Japanese|Italian|Greek|Brie|Marsala|Carnaroli|Hokkaido)/.test(s) ? s.charAt(0).toLowerCase() + s.slice(1) : s;
  const lines = steps.map((s, i) => {
    if (hasLead(s)) return s;
    if (i === 0) return "To start, " + lower(s);
    if (i === n - 1 && n > 2) return "Finally, " + lower(s);
    return fillers[(i - 1) % fillers.length] + lower(s);
  });
  const total = Number(r.time) ? fmtTime(r.time) : "";
  const intro = `${total ? `Plan for about ${esc(total)}; it serves ${esc(r.serves)}. If the description mentions soaking, marinating or chilling, do that ahead. ` : ""}Read the method through once before you begin, and have your ingredients weighed and chopped, so the cooking itself flows without a rush.`;
  return `<p class="method-intro">${intro}</p>
    <ol class="steps">${lines.map((s, i) => `<li><span class="step-n">Step ${i + 1}</span><p>${esc(s)}</p></li>`).join("")}</ol>
    <section class="keep"><h4>Keeping leftovers</h4><p>${esc(storageTip(r))}</p></section>
    <p class="img-note">Food images are visual representations of the recipe. Actual results may vary depending on ingredients, preparation and presentation.</p>`;
}
/* How to keep a dish for the next day or two, picked by the kind of dish */
function storageTip(r){
  const title = (r.title || "").toLowerCase(), ing = (r.ingredients || []).join(" ").toLowerCase(), all = title + " " + ing;
  const kind = r.art && r.art.kind, cat = r.category;
  const has = rx => rx.test(all), inTitle = rx => rx.test(title);
  if (inTitle(/hiyashi|mazesoba/)) return "Best eaten freshly made. Keep the toppings and the sauce or dressing in separate containers in the fridge for up to 2 days, and cook fresh noodles when you want to eat it.";
  if (inTitle(/vitello tonnato/)) return "Keep it covered in the fridge for up to 2 days and serve it cold. The flavour improves after a night in the fridge.";
  if (inTitle(/bruschetta/)) return "Best made just before serving. The tomato topping keeps covered in the fridge for up to 1 day; toast fresh bread and assemble at the last minute.";
  if (inTitle(/prosciutto e melone/)) return "Best served fresh. Cut melon keeps covered in the fridge for 1 day; add the prosciutto just before serving.";
  if (inTitle(/crostini/)) return "Keep the pâté in a covered container in the fridge for up to 2 days and toast fresh bread when you serve it.";
  if (inTitle(/rinforzo/)) return "This salad is meant to sit in its dressing. Keep it covered in the fridge for up to 2 days and bring it to room temperature before serving.";
  if (inTitle(/caponata|peperonata/)) return "Keep it covered in the fridge for up to 3 days; it tastes even better the next day. Serve it at room temperature or gently warmed.";
  if (inTitle(/fiorentina/)) return "Keep leftover steak wrapped in the fridge for up to 2 days. Slice it thinly and eat it cold, or warm it very briefly in a hot pan so it doesn't cook further.";
  if (inTitle(/polenta/)) return "Keep the polenta and the mushrooms covered in the fridge for up to 2 days. Polenta sets firm as it cools: slice it and pan-fry or grill the slices, then top with the reheated mushrooms.";
  if (r.course === "ramen" || kind === "ramen") return "Keep the broth and the toppings in separate airtight containers in the fridge for up to 2 days, and cook fresh noodles when you reheat: noodles left sitting in broth turn soft. Bring the broth back to a simmer before serving.";
  if (inTitle(/zabaione|affogato/)) return "This one doesn't keep. Make it just before you want to eat it.";
  if (inTitle(/guacamole/)) return "Guacamole browns quickly. Press cling film right onto the surface and keep it in the fridge for up to 1 day, then give it a stir before serving.";
  if (inTitle(/hummus|baba ghanoush/)) return "Keep it in a covered container in the fridge for up to 3 days, with a thin layer of olive oil on top to stop it drying out. Let it sit at room temperature for 15 minutes before serving.";
  if (inTitle(/cannoli/)) return "Store the shells and the filling separately: shells in an airtight tin at room temperature, filling covered in the fridge for up to 2 days. Fill them just before serving so the shells stay crisp.";
  if (inTitle(/cantucci|panforte/)) return "Store it in an airtight tin at room temperature. It keeps well for a couple of weeks.";
  if (inTitle(/tortino/)) return "Best eaten warm, straight from the oven, while the centre is molten. You can fill the ramekins up to a day ahead and keep them in the fridge, then bake them just before serving, adding a minute to the time.";
  if (inTitle(/mousse|panna cotta|bonet|cheesecake|tiramis/)) return "Keep it covered in the fridge for up to 2 days. Dairy-rich and set desserts shouldn't sit at room temperature for long.";
  if (has(/\bclams?\b|prawn|white fish|sea bream|fish fillet|bream|salmon|mackerel/) && cat !== "Starters") return "Seafood is best eaten the day it's cooked. If you have leftovers, cool them quickly, keep them covered in the fridge and eat them within 1 day, reheating gently.";
  if (inTitle(/patate/)) return "Keep them covered in the fridge for up to 2 days. Reheat on a tray in a hot oven (220°C) for about 10 minutes so they crisp up again; the microwave makes them soft.";
  if (inTitle(/lasagne|parmigiana|sorrentina|torta salata|pasta e broccoli al forno/)) return "Keep it covered in the fridge for up to 2 days. It often slices even better the next day. Reheat portions in the oven at 180°C, covered with foil, for about 20 minutes, until hot in the middle.";
  if (inTitle(/arancini|suppl|fiori|falafel|churros|carrozza|cotoletta|karaage|polpette di melanzane/)) return "These are best eaten fresh, while they're crisp. Leftovers keep in an airtight container in the fridge for up to 1 day. Reheat them on a tray in a hot oven (200°C) for 8 to 10 minutes to crisp them up again, rather than in the microwave.";
  if (kind === "tacos" || inTitle(/tacos|arayes|shawarma|puccia/)) return "Keep the filling in an airtight container in the fridge for up to 2 days, separate from the bread or tortillas and the fresh toppings. Reheat the filling in a hot pan and warm the bread just before serving.";
  if (has(/\bclams?\b|prawn|white fish|sea bream|fish fillet|bream|salmon|mackerel/) && cat !== "Starters") return "Seafood is best eaten the day it's cooked. If you have leftovers, cool them quickly, keep them covered in the fridge and eat them within 1 day, reheating gently.";
  if (cat === "Desserts" || cat === "Baking"){
    if (has(/mascarpone|cream|ricotta|custard|yogurt|gelatine|cheese|milk/) && !inTitle(/crostata|cantucci|sbrisolona|banana/)) return "Keep it covered in the fridge for up to 2 days. Dairy-rich desserts shouldn't sit at room temperature for long, and some contain raw egg.";
    return "Keep it covered or in an airtight tin at room temperature for up to 2 days. Wrap cut edges so they don't dry out.";
  }
  if (cat === "Salads") return "Salads are best fresh. To keep some, store the undressed ingredients in the fridge for up to 1 day and dress them just before eating. Keep crunchy things like toasted bread or nuts separate until the last minute.";
  if (inTitle(/risotto|arancini/)) return "Cool risotto quickly, within an hour, then keep it covered in the fridge and eat it within 1 day. Reheat it in a pan with a splash of stock until piping hot, or roll it into balls, coat in breadcrumbs and fry as arancini.";
  if (has(/\brice\b|basmati|carnaroli/) ) return "Cool rice dishes quickly, within an hour, then keep them covered in the fridge and eat them within 1 day. Reheat until piping hot all the way through, adding a splash of water so the rice doesn't dry out.";
  if (inTitle(/carbonara|cacio e pepe|gricia/)) return "These egg and cheese sauces are at their best straight from the pan. Leftovers keep in the fridge for up to 1 day. Reheat gently in a pan with a splash of water, stirring, so the sauce turns creamy again.";
  if (inTitle(/frittata/)) return "Keep it covered in the fridge for up to 2 days. It's lovely cold or at room temperature, cut into squares for lunch or a picnic.";
  if (inTitle(/shakshuka|chilaquiles/)) return "Best eaten fresh, because the eggs and crisp bits don't reheat well. Leftover sauce keeps in the fridge for up to 2 days. Warm it up and cook fresh eggs in it.";
  if (kind === "pasta" || has(/spaghetti|penne|rigatoni|linguine|tagliatelle|tagliolini|bucatini|trofie|orecchiette|macaroni|ravioli|gnocchi|short pasta|ditalini/)) return "Keep it in an airtight container in the fridge for up to 2 days. Reheat it in a pan with a splash of water to loosen the sauce, or let it come to room temperature if it's an oil-based dish.";
  if (cat === "Soups" || inTitle(/stew|spezzatino|cacciatora|ossobuco|curry|dal|chana|massaman|nikujaga|caponata|peperonata|polpette|pozole|cochinita|butter chicken|palak|moilee|musakhan/)) return "This keeps well: cool it, then store it covered in the fridge for up to 2 days. The flavour often gets even better overnight. Reheat gently in a pan until piping hot, adding a splash of water if it has thickened.";
  return "Store leftovers in an airtight container in the fridge for up to 2 days. Reheat gently until piping hot all the way through, covered so it doesn't dry out.";
}

let routeCount = 0;
function route(){
  // the entrance animation belongs to the first draw only; any redraw shows boxes straight away instead of restarting it
  if (routeCount++ > 0) document.documentElement.classList.remove("intro");
  const h = location.hash.slice(1);
  if (h !== "share" && !h.startsWith("k-")) state.preKitchen = "";
  const home = !(h === "share" || h === "look" || h === "saved" || h.startsWith("k-") || h.startsWith("r-"));
  document.getElementById("topbar").hidden = false;
  if (typeof Hero !== "undefined") Hero.hide(); /* the marble lazy-susan hero is kept in the code but switched off in this style */

  else if (h.startsWith("k-")) renderKitchen(h.slice(2));

  }
  let readyOnce = false;
  function show(){
    if (on) return; on = true; el.hidden = false; layout();
    const go = () => { layout(); el.classList.add("ready"); last = 0; phaseStart = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); };
    if (readyOnce) go(); else (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { readyOnce = true; if (on) go(); });
  }
  function hide(){ if (!on) return; on = false; cancelAnimationFrame(raf); el.hidden = true; }
  addEventListener("resize", () => { if (on) layout(); });
  document.getElementById("hsearch").addEventListener("click", () => { const q = document.getElementById("q"); if (q){ q.scrollIntoView({behavior: reduce ? "auto" : "smooth", block: "center"}); q.focus({preventScroll: true}); } });
  return {show, hide};
})();

const strip = ({author, ...rest}) => rest;
async function shrink(file){
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 1400 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(res => c.toBlob(res, "image/jpeg", 0.85));
    return b || file;
  } catch { return file; }
}
function save(uid, recipes){
  const run = () => db.doc("recipes/" + uid).set({recipes});
  writeChain = writeChain.catch(() => {}).then(run);
  return writeChain;
}
async function resolveNames(){
  if (!user) return;
  const ids = [...new Set(state.community.map(r => r.author))];
  if (!ids.length) return;
  const ps = await user.profiles(ids);
  let changed = false;
  for (const id of ids){ const n = ps[id]?.name || ""; if (state.names[id] !== n){ state.names[id] = n; changed = true; } }
  if (changed) route();
}
(async () => {
  if (!window.claude?.use){ state.db = "off"; route(); return; }
  [db, user, assetsApi] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("assets")]);
  const pf = document.getElementById("photoField"); if (pf && assetsApi) pf.hidden = false;
  if (user){ state.uid = await user.id(); state.isOwner = await user.isOwner(); me = await user.me(); renderMenu(); }
  if (!db){ state.db = "off"; route(); return; }
  if (state.uid){
    try {
      prefsRef = db.doc("data/users/" + state.uid + "/prefs"); prefsLocalOnly = false;
      let first = true;
      prefsRef.onSnapshot(s => {
        if (s.exists) applyPrefs(s.data());
        else if (first && (prefs.favs.size || prefs.searches.length)) savePrefs();
        first = false;
        if (location.hash === "#saved") renderSaved();
      }, () => { prefsLocalOnly = true; });
    } catch { prefsLocalOnly = true; }
  }
  const timer = setTimeout(() => { if (state.db === "loading"){ state.db = "slow"; route(); } }, 10000);
  db.collection("recipes").onSnapshot(snap => {
    const list = [];
    for (const d of snap.docs){
      const arr = d.data()?.recipes;
      if (Array.isArray(arr)) for (const r of arr) if (r && r.id && r.title) list.push({...r, author:d.id});
    }
    list.sort((a,b) => (b.created||0) - (a.created||0));
    state.community = list;
    if (!snap.metadata.fromCache){ clearTimeout(timer); state.db = "ready"; }
    // only redraw when something visible changed (avoids a flash on load, especially on phones)
    const sig = state.db + "|" + list.map(r => r.id + ":" + r.title + ":" + (r.photo || "")).join(",");
    if (sig !== state.lastSig){ state.lastSig = sig; if (location.hash.slice(1) !== "share") route(); }
    resolveNames();
  }, () => { clearTimeout(timer); state.db = "slow"; route(); });
})();
