  "i-bruschetta":["Dice the tomatoes and put them in a bowl with a good pinch of salt, the oil and torn basil, then leave them for 10 minutes. The salt draws out the juices, which mix with the oil into a light dressing.","Toast or grill the bread over high heat until it's crisp outside and charred at the edges, but still a little soft in the middle.","While the bread is hot, rub one side of each slice with the cut garlic. The rough surface works like a grater, so a few strokes are enough.","Spoon the tomatoes and some of their juices on top just before serving, so the bread stays crunchy."],
  "i-caprese":["Take the mozzarella and tomatoes out of the fridge 30 minutes before you start, so they lose their chill and taste of more.","Slice both about 1 cm thick. Drain the mozzarella slices briefly on kitchen paper so they don't water down the plate.","Overlap the tomato and mozzarella slices on a platter, tucking basil leaves between them.","Season with salt and a pinch of oregano, and finish with a generous drizzle of your best olive oil. Serve at room temperature."],
  "i-vitello":["Put the veal in a snug pot with the carrot, celery, onion and wine, and add water to just cover. Bring to a gentle simmer and cook for about 50 minutes, until just cooked through, then leave it to cool in the liquid so it stays moist.","For the sauce, blend the tuna, anchovies, egg yolks, half the capers and the mayonnaise until smooth. Loosen it with a few spoonfuls of the cooking liquid until it flows like thick cream.","Slice the cold veal as thinly as you can with a sharp knife and overlap the slices on a serving platter.","Spread the sauce over the meat, scatter with the remaining capers and chill for at least an hour so the flavours blend."],
  "i-arancini":["The day before, cook the rice in the stock with the saffron until the liquid is absorbed and the rice is tender. Stir in the butter and cheese, spread it on a tray and let it cool completely. Cold rice holds its shape far better.","Wet your hands and take a handful of rice. Flatten it in your palm, press a hollow in the middle and fill it with a spoonful of ragù, a few peas and a cube of provola. Close the rice around the filling and shape it into a ball.","Whisk the flour with enough cold water to make a smooth, thin batter. Dip each ball in the batter, then roll it in breadcrumbs until fully coated.","Heat the oil to 170°C and fry a few at a time for about 4 minutes, turning, until deep golden all over. Drain on kitchen paper and wait a couple of minutes before eating, because the cheese inside gets very hot."],
  "i-suppli":["Cook the rice with the passata, adding hot stock a ladle at a time as it's absorbed, until just tender, about 18 minutes. Stir in the Parmigiano, spread it on a tray and let it cool completely.","Take a heaped tablespoon of rice, press a stick of mozzarella into the middle and close the rice around it, shaping a neat oval about the size of an egg.","Dip each one in beaten egg, then roll it in breadcrumbs. For an extra-crisp crust, repeat the egg and crumbs once more.","Fry at 170°C for 3 to 4 minutes until crisp and golden. Serve hot, so when you pull one apart the mozzarella stretches into a long string."],
  "i-panzanella":["Tear the bread into chunks and soak it in cold water for about 5 minutes, until soft. Squeeze it firmly to remove as much water as possible, then crumble it into a large bowl.","Chop the tomatoes and cucumber into bite-sized pieces and add them to the bread with their juices and the sliced onion.","Dress with the oil, vinegar and a good pinch of salt, tear in the basil and toss with your hands so the bread soaks up the tomato juices.","Leave it for 20 minutes before serving. The salad gets better as the flavours mingle."],
  "i-crostini":["Warm the oil and soften the onion over medium heat for 5 minutes. Add the chicken livers and cook, turning, until browned outside but still a little pink inside, about 5 minutes.","Pour in the wine and let it bubble, then add the anchovies and capers and cook for 10 minutes more, stirring, until the anchovies melt into the sauce.","Take it off the heat and chop everything finely on a board, or pulse it briefly with the butter, keeping some texture.","Toast the bread slices, spread them with the warm pâté and serve straight away."],
  "i-melone":["Choose a melon that feels heavy for its size and smells sweet at the stem end. Chill it for an hour if you have time.","Halve the melon, scoop out the seeds and cut it into wedges, then slice away the rind.","Drape a thin slice of prosciutto over each wedge, letting it fall in loose folds.","Finish with a twist of black pepper and serve cold."],
  "i-fiori":["Open each flower gently and pinch out the pistil inside. Check for insects and give them a gentle shake rather than a wash, so they stay dry.","Tuck a stick of mozzarella and a piece of anchovy inside each flower and twist the tips of the petals to close it.","Just before frying, whisk the flour with the ice-cold sparkling water into a thin batter. Cold, bubbly water makes the coating light and crisp.","Heat the oil to 175°C. Dip each flower in the batter, let the excess drip off and fry for about 2 minutes until pale gold. Drain, sprinkle with salt and serve straight away."],
  "i-frittata":["Warm the oil in a 24 cm non-stick pan and cook the onion and courgettes over medium heat for 8 to 10 minutes, until soft and lightly golden.","Beat the eggs with the Parmigiano, torn basil, salt and pepper, and pour them over the vegetables. Stir once to spread everything evenly.","Turn the heat to low, cover and cook for about 8 minutes, until the edges are set and the top is almost firm.","Slide the frittata onto a plate, flip it back into the pan and cook for 2 minutes more to set the other side. Serve warm or at room temperature, cut into wedges."],
  // Primi
  "i-cacio":["Crush the peppercorns coarsely and toast them in a dry, wide pan for a minute, until fragrant. Once the pasta water is boiling, add a ladle of it to the pepper and let it simmer.","In a bowl, mix the finely grated pecorino with a few spoonfuls of warm, not boiling, pasta water and mash it into a smooth, thick cream. Water that's too hot makes the cheese clump.","Cook the pasta until quite al dente and lift it into the pepper pan with a little more water. Toss for a minute so it finishes cooking.","Take the pan off the heat, wait a few seconds, then add the pecorino cream and toss quickly, adding water a little at a time, until the sauce is creamy and glossy. Serve straight away."],
  "i-gricia":["Cut the guanciale into strips and render it slowly in a wide pan over medium-low heat, until the fat runs clear and the pieces are crisp and golden.","Cook the rigatoni in salted water until al dente, then lift them into the guanciale pan with a generous ladle of the starchy cooking water.","Toss over low heat for a minute so the fat and water start to come together, then take the pan off the heat.","Add the pecorino a handful at a time, tossing and adding a splash of water if needed, until the sauce turns creamy. Finish with plenty of black pepper."],
  "i-arrabbiata":["Warm the oil in a wide pan over low heat with the garlic and crumbled chili, until the garlic sizzles gently and smells sweet but hasn't browned.","Add the tomatoes, crush them with a wooden spoon and simmer for about 12 minutes, until the sauce is thick and the oil starts to separate at the edges. Season with salt.","Cook the penne in salted water until al dente, drain and toss them in the sauce over the heat for a minute.","Scatter over the parsley and serve. Taste first: if you want it angrier, add more chili."],
  "i-lasagne":["Heat the oven to 180°C and butter a deep baking dish. Warm the ragù and béchamel slightly so they spread easily.","Spread a thin layer of ragù on the bottom, then add a layer of pasta sheets, slightly overlapping. Spoon over ragù, then béchamel, and sprinkle with Parmigiano.","Repeat the layers 5 or 6 times, finishing with béchamel, a generous handful of Parmigiano and a few flakes of butter.","Bake for about 40 minutes, until the top is golden and the edges bubble. Rest for 15 minutes before cutting so the layers hold together."],
  "i-tagliatelle":["Warm a little oil in a heavy pot and cook the pancetta with the chopped carrot, celery and onion over low heat for about 10 minutes, until soft and sweet.","Turn up the heat, add the beef and pork and cook, breaking up the meat, until it's well browned and any liquid has evaporated. Browning builds much of the flavour.","Pour in the wine and let it bubble away, then stir in the passata and milk. The milk makes the meat tender and the sauce mellow.","Turn the heat right down and simmer, partly covered, for 2½ to 3 hours, stirring now and then and adding a splash of water if it gets too dry. The ragù is ready when it's thick, glossy and deep in colour.","Cook the tagliatelle, toss them with the ragù and a little pasta water, and serve with grated Parmigiano."],
  "i-vongole":["Soak the clams in cold salted water for an hour so they spit out any sand, then rinse them. Throw away any that are cracked or stay open when tapped.","Warm the oil with the garlic and chili in a wide pan. Add the clams and wine, cover and cook over high heat for 3 to 4 minutes, shaking the pan, until the shells open. Discard any that stay closed.","Meanwhile, cook the spaghetti until 2 minutes short of al dente.","Add the spaghetti to the clam pan and toss over the heat for 2 minutes, so the pasta finishes cooking in the briny juices and soaks up their flavour.","Toss in the parsley and serve right away, with a bowl on the table for the shells."],
  "i-norma":["Fry the aubergine cubes in batches in plenty of hot oil until deep golden and soft inside. Drain on kitchen paper and sprinkle with salt.","In another pan, warm a little oil with the garlic, add the passata and simmer for 15 minutes until slightly thickened. Season.","Stir most of the aubergine and a few torn basil leaves into the sauce, keeping some aubergine back for the top.","Cook the pasta, toss it with the sauce, and serve topped with the remaining aubergine, more basil and a generous grating of ricotta salata."],
  "i-sorrentina":["Simmer the passata with the oil, garlic and a few basil leaves for 15 minutes, until it thickens slightly. Season with salt.","Heat the oven to 220°C. Cook the gnocchi in salted boiling water and lift them out as soon as they float to the surface.","Mix the gnocchi with the sauce and half the mozzarella and spread them in a baking dish.","Scatter over the remaining mozzarella and the Parmigiano and bake for about 10 minutes, until the cheese is melted and bubbling. Finish with fresh basil."],
  "i-orecchiette":["Trim the cime di rapa, keeping the tender leaves and florets. Bring a big pot of salted water to the boil, add the greens and cook for 4 minutes, then add the orecchiette to the same pot.","Meanwhile, warm the oil in a large pan with the garlic, chili and anchovies, stirring until the anchovies melt into the oil.","When the pasta is al dente, drain it with the greens and tip everything into the anchovy pan. Toss well so the greens break down a little and coat the pasta.","Serve topped with the toasted breadcrumbs, which add crunch in place of cheese."],
  "i-fagioli":["Warm the oil in a pot and cook the onion, carrot and celery gently for 8 to 10 minutes, until soft. Stir in the tomato paste and rosemary and cook for a minute.","Add the beans and stock, bring to a simmer and cook for 20 minutes so the flavours come together.","Blend about a third of the soup and stir it back in. This makes it thick and creamy without any cream.","Add the pasta and simmer, stirring often so it doesn't stick, until tender. Rest for 5 minutes off the heat and serve with a drizzle of olive oil."],
  // Secondi
  "i-saltimbocca":["If the escalopes are thick, flatten them between two sheets of baking paper. Lay a slice of prosciutto and a sage leaf on each and fix them with a toothpick.","Dust only the underside with flour and shake off the excess.","Melt the butter in a wide pan until it foams. Fry the escalopes ham side up for 2 minutes, then flip and cook for 1 minute more, until the ham is crisp.","Move the meat to a warm plate, pour the wine into the pan and let it bubble, scraping up the brown bits, until it reduces to a glossy sauce. Spoon it over the saltimbocca and serve."],
  "i-cacciatora":["Season the chicken and brown it well in the oil over medium-high heat, skin side down first, until golden all over. Set it aside.","Lower the heat, add the onion and garlic to the same pan and cook for 5 minutes until soft. Pour in the wine and let it bubble for a couple of minutes, scraping the bottom.","Add the tomatoes, olives and rosemary, crush the tomatoes, and nestle the chicken back in.","Cover and simmer gently for about 45 minutes, until the chicken is tender and the sauce has thickened. Serve with bread or polenta."],
  "i-ossobuco":["With scissors, snip the thin membrane around each shank in two or three places so they don't curl as they cook. Season, dust with flour and brown them well in the butter on both sides.","Add the onion and cook until soft, then pour in the wine and let it reduce by half.","Add the stock, cover and simmer very gently for about 1½ hours, turning the shanks once, until the meat is tender enough to cut with a spoon. Add a splash of water if the sauce gets too thick.","Finely chop the lemon zest, garlic and parsley together to make the gremolata and scatter it over just before serving. Don't forget the marrow in the bone."],
  "i-cotoletta":["Pound the meat lightly to an even thickness, leaving the bone attached, and season it with a little salt.","Dip the chops in beaten egg, then press them firmly into the breadcrumbs on both sides so the coating sticks well.","Heat the clarified butter in a wide pan over medium heat and fry the chops for about 4 minutes per side, until deep golden and crisp.","Drain briefly on kitchen paper, sprinkle with salt and serve with lemon wedges."],
  "i-polpette":["Squeeze the soaked bread well and put it in a bowl with the meat, egg, Parmigiano, garlic, parsley and a good pinch of salt. Mix with your hands until evenly combined, but don't overwork it.","Roll into balls about the size of a walnut, with slightly wet hands so the mixture doesn't stick.","Brown the meatballs in the oil in a wide pan, turning them gently, then pour in the passata.","Cover and simmer gently for 30 minutes, shaking the pan now and then. Serve with plenty of bread for the sauce."],
  "i-scaloppine":["Pound the escalopes thin and dust them lightly with flour.","Heat the butter and oil in a wide pan until foaming and fry the veal for about 1 minute per side, until lightly golden. Move it to a plate.","Pour the lemon juice and stock into the pan and scrape up the browned bits. Let it bubble for a minute.","Return the veal and its juices and turn it for a minute, until coated in a silky sauce. Scatter with parsley and serve."],
  "i-orata":["Heat the oven to 200°C. Toss the potatoes with half the oil, the garlic, rosemary and salt, spread them in a roasting tin and roast for 20 minutes.","Meanwhile, season the fish inside and out and stuff each one with lemon slices and herbs.","Lay the fish on the potatoes with the tomatoes and olives around them, and drizzle with the rest of the oil.","Roast for 20 to 25 minutes, until the flesh is opaque and flakes easily from the bone."],
  "i-fiorentina":["Take the steak out of the fridge 2 hours before cooking so it comes up to room temperature.","Heat a grill or heavy pan until smoking hot. Cook the steak for 5 minutes per side without moving it, so it forms a dark crust.","Stand the steak upright on its bone for 5 minutes more, which warms the centre without overcooking the outside.","Rest for 5 minutes, cut the meat off the bone and slice it thickly. Season with coarse salt, pepper and a drizzle of olive oil."],
  "i-salsiccia":["Put the sausages in a pan with a splash of water and cook over medium heat. When the water has evaporated, let them fry in their own fat, turning, until browned and cooked through.","Trim the greens, discarding the tough stems, and wash them well.","Warm the oil with the garlic and chili in a large pan, add the greens, cover and cook for about 10 minutes, stirring now and then, until tender.","Add the sausages to the greens for the last 5 minutes so the flavours mingle, then serve."],
  "i-spezzatino":["Toss the beef in flour and brown it in batches in hot oil, so the pieces don't crowd the pan and steam. Set aside.","Lower the heat and soften the chopped onion, carrots and celery for 8 minutes, then return the beef and pour in the wine, scraping up the brown bits.","Stir in the tomato paste, stock and rosemary, cover and simmer gently for 1½ hours.","Add the potatoes and cook for 30 minutes more, until they're tender and the sauce has thickened. Taste and season before serving."],
  // Contorni
  "i-patate":["Heat the oven to 210°C. Cut the potatoes into chunks, then dry them well with a tea towel: dry potatoes crisp, wet ones steam.","Toss them in a roasting tin with the oil, unpeeled garlic, rosemary and salt, and spread them out in a single layer.","Roast for 40 to 45 minutes, turning once halfway, until deep golden and crisp outside and fluffy inside."],
  "i-peperonata":["Warm the oil in a wide pan and soften the onion over medium heat for 5 minutes.","Add the peppers and cook for 10 minutes, stirring, until they start to soften and colour at the edges.","Add the tomatoes, cover and simmer gently for about 25 minutes, until everything is soft and jammy.","Stir in a splash of vinegar and torn basil and season with salt. It's lovely warm or at room temperature."],
  "i-caponata":["Fry the aubergine cubes in hot oil in batches until golden, then drain them on kitchen paper.","Blanch the celery in boiling water for 2 minutes, so it softens but stays crunchy.","In a wide pan, soften the onion in a little oil, then add the passata, celery, olives, capers and pine nuts and cook for 10 minutes.","Stir in the vinegar and sugar and let it bubble for a minute, then fold in the aubergine and leave to cool. Caponata tastes best the next day, at room temperature."],
  "i-carciofi":["Pull away the tough outer leaves of each artichoke until you reach the pale, tender ones. Trim the stem and cut off the spiky tip, then rub everything with lemon so it doesn't darken.","Finely chop the mint and garlic with a pinch of salt and push the mixture between the leaves.","Stand the artichokes head down in a pot just big enough to hold them snugly, and pour in the oil and water.","Cover and cook on low heat for 35 to 40 minutes, until a knife slides easily into the base. Serve warm, with the cooking juices spooned over."],
  "i-fagiolini":["Blanch the beans in salted boiling water for 4 minutes, then drain.","Warm the garlic in the oil, add the passata and simmer for 5 minutes.","Add the beans and cook for 10 to 15 minutes, until tender and coated in sauce.","Season and finish with torn basil."],
  "i-zucchine":["Warm the oil with the garlic in a wide pan over medium heat until fragrant.","Add the courgettes and cook for 10 to 12 minutes, stirring now and then, until tender and lightly golden. Don't crowd the pan, or they'll turn watery.","Season with salt and pepper and toss with the parsley."],
  "i-cicoria":["Wash the greens well and boil them in salted water for about 8 minutes, until tender. Drain, let them cool slightly and squeeze out the water.","Warm the oil with the garlic and chili in a wide pan until the garlic turns golden.","Add the greens and sauté for about 5 minutes, turning them, until glossy and full of flavour. Season with salt."],
  "i-finocchi":["Trim the fennel and slice it as thinly as you can. A mandoline helps.","Cut the peel and white pith off the oranges with a knife, then slice them into rounds, saving any juice.","Arrange the fennel, oranges, onion and olives on a plate, season with salt and pepper, and drizzle with the oil and the saved orange juice."],
  "i-uccelletto":["Warm the oil with the garlic and sage over low heat, until the leaves crisp and the oil smells fragrant.","Add the tomatoes, crush them and simmer for 10 minutes.","Add the beans and simmer for 15 minutes more, stirring now and then, until thick and creamy.","Season with pepper and finish with a drizzle of oil."],
  "i-funghetto":["Fry the aubergine cubes in hot oil until golden on all sides, then drain on kitchen paper and salt them.","In a clean pan, warm a little oil with the garlic, add the tomatoes and cook for about 5 minutes, until they burst.","Add the aubergine and basil and toss gently for 2 minutes, until everything is coated."],
  // Dolci
  "i-pannacotta":["Soak the gelatine leaves in cold water for 10 minutes, until soft.","Heat the cream, milk and sugar with the vanilla seeds and pod until steaming, without letting it boil. Take it off the heat and remove the pod.","Squeeze the gelatine and stir it into the warm cream until completely dissolved. Pour into moulds or glasses and chill for at least 4 hours, until set with a gentle wobble.","For the sauce, simmer the berries with the sugar for 5 minutes, then cool. Dip each mould briefly in hot water, turn out the panna cotta and spoon the sauce over."],
  "i-cannoli":["Knead the flour, sugar, lard, egg and Marsala into a firm, smooth dough. Wrap it and rest for an hour.","Roll the dough very thin, cut 10 cm rounds and wrap each around a metal tube, sealing the overlap with a little egg white.","Fry at 180°C for 1 to 2 minutes until blistered and golden. Cool slightly, then slide them off the tubes.","Beat the drained ricotta with the icing sugar until smooth, then fold in the chocolate and orange peel. Pipe it into the shells just before serving, so they stay crisp."],
  "i-torta-caprese":["Heat the oven to 170°C and line a 24 cm tin with baking paper.","Melt the chocolate and butter together over low heat, or in a bowl over simmering water, then let it cool slightly.","Whisk the eggs and sugar until pale and thick, then fold in the chocolate and the ground almonds.","Pour into the tin and bake for about 40 minutes, until the top is crisp and the middle still slightly soft. Cool in the tin and dust with icing sugar."],
  "i-zabaione":["In a heatproof bowl, whisk the yolks and sugar until pale and creamy.","Set the bowl over a pan of barely simmering water, making sure it doesn't touch the water, and add the Marsala a little at a time.","Whisk without stopping for 8 to 10 minutes, until the mixture is thick, airy and has tripled in volume. If it starts to look grainy, lift the bowl off the heat for a moment.","Serve warm in glasses with biscuits or fresh berries."],
  "i-affogato":["Chill the glasses in the freezer for 10 minutes so the gelato doesn't melt too fast.","Put a scoop of gelato in each glass.","Brew the espresso and pour it over the gelato at the table. Scatter with chocolate and eat straight away."],
  "i-crostata":["Rub the cold butter into the flour until it looks like breadcrumbs, then add the sugar, zest, egg and yolk and bring it together into a dough without kneading too much. Wrap and chill for 30 minutes.","Heat the oven to 180°C. Roll out two thirds of the pastry and line a 24 cm tart tin.","Spread the jam evenly over the base. Roll out the remaining pastry, cut it into strips and lay them on top in a lattice, pressing the ends onto the edge.","Bake for about 35 minutes, until golden. Let it cool completely before slicing, so the jam sets."],
  "i-cantucci":["Heat the oven to 180°C. Mix the flour, sugar, baking powder, zest and salt, then add the eggs and almonds and bring it all together into a sticky dough.","With floured hands, shape two long logs on a lined baking tray and bake for 25 minutes, until golden and firm.","Cool for 10 minutes, then cut diagonally into slices about 1.5 cm thick with a serrated knife.","Lay the slices flat and bake for 10 minutes more, until dry and crisp. They keep for weeks in a tin."],
  "i-nonna":["Heat the milk with the lemon zest. In a pan, whisk the yolks, sugar and cornflour, pour in the hot milk and cook over low heat, whisking, until thick. Cover with cling film and cool.","Heat the oven to 180°C. Line a 24 cm tin with two thirds of the pastry and fill it with the cold custard.","Cover with the rest of the pastry, seal the edges well and scatter with pine nuts, pressing them in lightly.","Bake for about 45 minutes, until golden. Cool completely and dust with icing sugar before serving."],
  "i-sbrisolona":["Heat the oven to 180°C and butter a 26 cm tin.","Rub the flour, polenta, ground almonds, sugar, butter, egg yolk and zest together with your fingertips until you have coarse, uneven crumbs.","Scatter the crumbs loosely into the tin without pressing them down, and dot the whole almonds on top.","Bake for about 40 minutes, until golden. Let it cool, then break it into pieces with your hands rather than slicing it."],
  "i-bonet":["Melt 100 g of sugar in a dry pan over medium heat, swirling, until it turns a deep amber caramel. Pour it straight into a loaf tin and tilt to coat the bottom.","Whisk the eggs with the sugar, cocoa, crushed amaretti and rum, then whisk in the milk until smooth, and pour it over the caramel.","Set the tin in a larger dish, pour hot water around it to come halfway up, and bake at 160°C for about 50 minutes, until set.","Cool, then chill for at least 3 hours. Run a knife around the edge and turn it out onto a plate, so the caramel runs down the sides."]
};
Object.assign(LONG_STEPS, {
  // House dishes
  "h-shakshuka":["Warm the oil in a wide, deep frying pan over medium heat and cook the onion and pepper for about 8 minutes, stirring now and then, until soft and starting to colour.","Add the garlic, cumin and paprika and stir for a minute, until the spices smell toasty. Don't let them burn, or they turn bitter.","Pour in the tomatoes, crush them with a spoon, season with salt and simmer for about 10 minutes, until the sauce is thick enough to hold a channel when you drag a spoon through it.","Make six little wells in the sauce and crack an egg into each. Cover and cook on low heat for 5 to 7 minutes, until the whites are set but the yolks are still runny.","Scatter over the crumbled feta and coriander and bring the pan to the table, with bread for dipping."],
  "h-lentil":["Melt the butter in a large pot over low heat and cook the onion and carrot gently for about 8 minutes, until soft and sweet but not browned.","Stir in the garlic and cumin and cook for a minute, until fragrant.","Add the rinsed lentils and stock, bring to a boil, then lower the heat and simmer for about 20 minutes, stirring now and then, until the lentils have collapsed into a thick purée.","Blend until smooth, then season with salt and squeeze in lemon juice a little at a time, tasting as you go. The lemon brightens the earthy lentils."],
  "h-chickpea":["Put the sliced onion in a large bowl with the vinegar and a pinch of salt and leave it for 5 minutes. This softens its bite and turns it a pretty pink.","Add the drained chickpeas, diced cucumber and torn parsley and mint.","Pour over the oil, season well with salt and pepper and toss everything together. Taste and add a little more vinegar if it needs more zing."],
  "h-banana":["Heat the oven to 175°C and line a 900 g loaf tin with baking paper.","Melt the butter in a small pan over medium heat and keep cooking, swirling the pan, until it foams, smells nutty and you see golden-brown flecks at the bottom, about 5 minutes. Pour it into a bowl and let it cool for 5 minutes.","Mash the bananas well in a large bowl, then whisk in the browned butter, brown sugar, eggs and vanilla until smooth.","Add the flour, baking soda and salt and fold them in with a spatula until just combined. A few streaks of flour are fine; overmixing makes the loaf tough.","Pour into the tin and bake for 55 to 60 minutes, until a skewer pushed into the middle comes out clean. Cool in the tin for 15 minutes before turning it out."],
  "h-mousse":["Fill a large bowl with ice and a little cold water and set a smaller, clean bowl inside it.","Put the chocolate and water in a pan and melt them together over low heat, stirring, until completely smooth.","Pour the chocolate into the chilled bowl and whisk hard. After a few minutes it will start to thicken. Stop as soon as it reaches soft peaks: if you go too far it turns grainy, and then you can simply melt it again and start over.","Spoon into glasses and chill for at least 4 hours, until set."],
  // Japanese
  "h-oyakodon":["Put the dashi, soy sauce, mirin and sugar in a small frying pan with the sliced onion and simmer for about 3 minutes, until the onion softens.","Add the chicken pieces in one layer and simmer for 5 to 6 minutes, turning once, until cooked through.","Beat the eggs lightly with chopsticks so that streaks of white remain. Pour about two thirds over the chicken, cover and cook for 1 minute.","Pour in the rest of the egg and cook for 30 seconds more, until it's just set but still soft and silky.","Slide everything, with the sauce, over bowls of hot rice and scatter with spring onion."],
  "h-okonomiyaki":["Whisk the flour and dashi into a smooth batter, then beat in the eggs.","Fold in the shredded cabbage and spring onions until everything is just coated. Don't overmix: the air in the batter keeps the pancake light.","Heat the oil in a frying pan over medium heat and spread half the mixture into a thick round about 2 cm high. Lay two slices of pork belly on top.","Cook for about 5 minutes, until golden underneath, then flip carefully with two spatulas and cook for 5 minutes more with the pork side down, until crisp. Repeat with the rest.","Brush the top with okonomiyaki sauce, zigzag with mayonnaise and scatter with aonori and katsuobushi. The bonito flakes will wave in the heat."],
  "h-karaage":["Cut the chicken into large bite-sized pieces and mix it with the soy sauce, sake, ginger and garlic. Leave it to marinate for 20 minutes.","Drain off any excess marinade and toss the pieces in the potato starch, pressing it on so every piece is well coated.","Heat the oil to 170°C and fry the chicken in batches for about 3 minutes, until pale golden. Lift it onto a rack and rest for 4 minutes: the heat carries on cooking the inside.","Turn the oil up to 190°C and fry the chicken again for about 1 minute, until deep golden and very crisp.","Drain on kitchen paper and serve straight away with lemon wedges."],
  "h-miso":["Soak the dried wakame in cold water for 5 minutes, until it swells, then drain it.","Bring the dashi to a gentle simmer and add the tofu cubes and wakame.","Turn the heat to low. Put the miso in a ladle, dip it into the pot and stir with chopsticks until the miso dissolves, then stir it into the soup.","Heat until steaming, without letting it boil: boiling dulls the flavour of the miso. Serve topped with spring onion."],
  "h-nikujaga":["Heat the oil in a pot and fry the beef until it just changes colour. Add the onion, potatoes and carrot and stir to coat them in the fat.","Pour in the dashi and sake, bring to a boil and skim off any foam that rises.","Add the mirin and sugar. Lay a small lid or a circle of baking paper directly on the surface so the liquid circulates over the vegetables, and simmer for 10 minutes.","Add the soy sauce and simmer for 10 minutes more, until the potatoes are tender and the broth has reduced by about half. Adding the soy later keeps the potatoes from firming up.","Blanch the snow peas for a minute and scatter them over just before serving."],
  "j-shio":["Put the chicken stock and kombu in a pot and warm it gently for about 20 minutes, keeping it just below a simmer. Lift out the kombu before it boils, or it turns slimy and bitter.","Make the tare by stirring the salt, light soy sauce and sake into a ladle of the hot broth. Divide it between two deep bowls along with the chicken fat or oil.","Cook the noodles as the packet says, usually 1 to 2 minutes, and drain them really well: water left on the noodles dilutes the broth.","Pour the hot broth into the bowls and stir to mix with the tare, then add the noodles and lift them with chopsticks so they sit neatly.","Top with the chashu or chicken, the halved egg, spring onion and a sheet of nori tucked at the side. Eat straight away, while the noodles are springy."],
  "j-shoyu":["Heat the chicken stock and dashi together in a pot until steaming.","For the tare, simmer the soy sauce, mirin and sake in a small pan for 1 minute to cook off the alcohol. Divide it and the oil between two deep bowls.","Cook the noodles as the packet says and drain them well.","Pour the hot broth into the bowls and stir, then add the noodles.","Arrange the chashu, marinated egg, menma, spring onion and nori on top and serve straight away."],
  "j-miso":["Heat the oil in a wok or wide pot over high heat and stir-fry the pork with the garlic and ginger until browned. Add the bean sprouts and cabbage and toss for 2 minutes, until just wilted.","Pour in the stock and bring it to a simmer.","In a bowl, whisk the miso and sesame paste with a ladle of the hot broth until smooth, then stir it back into the pot. From here on, keep it below the boil so the miso stays fragrant.","Cook the noodles, drain well and divide between deep bowls. Ladle over the broth and vegetables.","Top with the sweetcorn, a pat of butter that melts into the broth, and spring onion."],
  "j-tonkotsu":["Put the bones in a large pot, cover with cold water and bring to the boil for 10 minutes. Drain, then rinse the bones and scrub off the grey scum. This keeps the finished broth clean.","Return the bones to the clean pot with fresh water, the onion, garlic and ginger. Keep it at a hard, rolling boil for 10 to 12 hours, topping up with boiling water as it reduces. The vigorous boil breaks down the collagen and turns the broth milky white.","Strain the broth through a fine sieve and season it with the soy sauce and salt.","Cook the thin noodles for about 1 minute so they stay firm, drain and add them to bowls of the hot broth.","Top with chashu, the halved eggs, spring onion, pickled ginger and sesame."],
  "j-mayu":["Put the chopped garlic and neutral oil in a small pan over medium-low heat and cook, stirring all the time, for about 15 minutes. The garlic will go golden, then brown, then completely black. Open a window: it smokes a little.","Take it off the heat, let it cool for a few minutes, then add the sesame oil and blend until smooth and inky. This black garlic oil is mayu, bittersweet and smoky.","Heat the pork broth with the soy sauce.","Cook the noodles, drain well and add them to bowls of hot broth.","Drizzle a spoonful or two of mayu over each bowl and top with chashu, the halved egg, wood ear mushrooms and spring onion."],
  "j-veg-miso":["Put the kombu and dried shiitake in the water and leave them to soak for 30 minutes. Then warm the pot slowly and lift out the kombu just before it boils.","Simmer the broth with the shiitake for 10 minutes, then take them out, slice them and return them to the pot.","Turn the heat down so the broth is no longer bubbling, and whisk in the miso, soy sauce and ginger.","Cook the noodles, drain them well and divide between bowls. Pour over the hot broth.","Top with the corn, a pat of butter, the halved egg, bean sprouts and spring onion."],
  "j-vegan-shoyu":["Soak the kombu and dried shiitake in the water for 30 minutes, then simmer gently for 15 minutes and strain. Slice the softened shiitake and keep them for the top.","Season the broth with the soy sauce, mirin and sesame oil, and keep it hot.","Toss the tofu cubes in cornflour and fry them in the oil over medium-high heat, turning, until golden and crisp on all sides. Blanch the bok choy for 1 minute.","Cook the egg-free noodles, drain well and add them to bowls of the hot broth.","Top with the crispy tofu, bok choy, shiitake, spring onion and a sheet of nori."],
  "j-vegan-tantan":["Heat the oil in a pan and fry the rehydrated soy mince with the garlic and ginger, stirring, until browned and a little crisp. Season with 1 tbsp of the soy sauce.","In each serving bowl, whisk the tahini, miso and the remaining soy sauce into a smooth paste.","Warm the soy milk and stock together gently, without letting them boil, or the soy milk can split. Pour into the bowls a little at a time, whisking, so the broth turns creamy.","Cook the noodles and blanch the bok choy, then add both to the bowls.","Top with the soy mince and spring onion and finish with a generous drizzle of chili oil."],
  "j-tantanmen":["Heat the oil in a pan and fry the minced pork with the garlic, ginger and doubanjiang, breaking it up, until browned and crisp at the edges.","In each serving bowl, mix the sesame paste, soy sauce and vinegar into a smooth paste.","Pour in the hot stock a little at a time, stirring, until the broth is creamy.","Cook the noodles and blanch the bok choy, then add them to the bowls.","Top with the spicy pork and spring onion and finish with chili oil."],
  "j-tsukemen":["Put the stock, soy sauce, mirin, vinegar, sugar and katsuobushi in a pan and simmer for 10 minutes, then strain. The dipping broth should taste much stronger than a normal ramen soup, with a gentle sourness, because it only coats the noodles.","Cook the thick noodles as the packet says, then rinse them under cold running water and drain well. Chilling them firms them up and gives them their springy bite.","Pile the noodles on plates with the chashu, halved egg and nori.","Pour the hot broth into small bowls and add the spring onion. Dip a mouthful of noodles into the broth as you eat."],
  "j-hiyashi":["Whisk the soy sauce, vinegar, sugar and sesame oil with 2 tbsp water until the sugar dissolves, then chill the dressing.","Beat the eggs and cook them in a lightly oiled pan as two or three thin omelettes. Roll them up and slice into fine ribbons.","Cook the noodles, then rinse them in iced water until completely cold and drain very well.","Pile the noodles on plates and arrange the egg, cucumber, ham and tomato on top in neat colourful rows.","Pour over the dressing and finish with sesame seeds and a dab of mustard on the side."],
  "j-mazesoba":["Fry the minced pork with the garlic and doubanjiang in a hot pan until browned and crisp, then stir in 1 tbsp of the soy sauce.","Mix the remaining soy sauce, the sesame oil and the chili oil in the bottom of each bowl.","Cook the thick noodles, drain them well and toss them in the sauce while they're hot.","Top with the spicy pork, chives, shredded nori, katsuobushi and an egg yolk in the middle.","Mix everything together vigorously at the table, so the yolk turns into a glossy sauce that coats the noodles."],
  "s-nabe":["Pour the dashi into a wide, shallow pot and season it with the soy sauce and mirin. Taste: it should be light and savoury.","Bring it to a simmer and add the chicken first, as it takes longest. Cook for 5 minutes, then add the cabbage, leeks and mushrooms.","Add the fish, prawns and tofu last and simmer gently, without stirring too much, until the fish turns opaque and the prawns pink.","Set the pot on the table, over a portable burner if you have one, and let everyone help themselves, adding more ingredients as you go."],
  // Mexican
  "m-pastor":["Toast the dried chilies in a dry pan for about 30 seconds per side, until fragrant, then soak them in hot water for 15 minutes. Drain and blend with the achiote, pineapple juice, vinegar, garlic, cumin, oregano and a good pinch of salt into a smooth paste.","Coat the sliced pork in the marinade and leave it for at least 2 hours, or overnight in the fridge.","Heat a heavy pan or griddle until very hot and sear the pork in batches, without crowding, until it's charred at the edges. Chop it into small pieces.","Sear the diced pineapple in the same pan until caramelised. Warm the tortillas in a dry pan.","Fill each tortilla with pork, pineapple, chopped onion and coriander, and finish with a squeeze of lime."],
  "m-guacamole":["Put the chopped onion, chili and a pinch of salt in a bowl, or a molcajete if you have one, and mash them into a rough paste. This releases their flavour into the avocado.","Halve the avocados, scoop out the flesh and mash it into the paste with a fork, leaving it chunky.","Fold in the tomato, coriander and lime juice.","Taste and add more salt or lime, then serve straight away with tortilla chips, before the avocado starts to brown."],
  "m-pozole":["Put the pork in a large pot with half the onion, 2 garlic cloves, salt and 3 l water. Bring to the boil, skim, then simmer gently for 1½ hours, until the meat is tender.","Toast the chilies in a dry pan for a few seconds per side, then soak them in hot water for 15 minutes. Blend with the rest of the onion and garlic and a cup of the broth, and strain the sauce into the pot.","Add the hominy and oregano and simmer for 30 minutes more, so the broth turns deep red and the flavours come together. Season with salt.","Serve in deep bowls with the shredded cabbage, sliced radish, lime wedges and tostadas on the side, so everyone can add their own crunch."],
  "m-enchiladas":["Put the tomatillos, chilies, onion and garlic in a pan, cover with water and simmer for about 8 minutes, until the tomatillos turn olive green. Drain and blend with the coriander and salt.","Heat the oil in a pan and pour in the salsa carefully, as it will splutter. Cook for 5 minutes, stirring, until it darkens slightly and thickens.","Heat the oven to 200°C. Warm the tortillas so they're soft and pliable, fill each with chicken and roll it up. Lay them seam side down in a baking dish.","Pour the salsa over the enchiladas, spoon over the crème fraîche and scatter with cheese.","Bake for about 15 minutes, until hot and bubbling at the edges."],
  "m-cochinita":["Blend the achiote paste with the orange and lime juice, garlic, cumin and a good pinch of salt. Rub it all over the pork and leave to marinate, overnight in the fridge if you can.","Line a roasting dish with banana leaves, lay the pork on top with the marinade and fold the leaves over. Cover tightly with foil and roast at 160°C for about 3½ hours, until the meat falls apart.","Meanwhile, put the sliced onions and habanero in a jar. Heat the vinegar with a pinch of salt and pour it over. After an hour the onions turn bright pink.","Shred the pork with two forks and mix it with its juices. Serve in warm tortillas topped with the pickled onions."],
  "m-chilaquiles":["Soak the dried chili in hot water for 15 minutes, then blend it with the tomatoes, garlic and onion until smooth.","Heat the oil in a wide pan, pour in the salsa and simmer for about 8 minutes, until it thickens and darkens. Season with salt.","Meanwhile, fry the eggs in a separate pan until the whites are set and the yolks still runny.","Add the tortilla chips to the hot salsa and toss for about a minute. They should soften at the edges but keep some crunch.","Plate straight away and top with the eggs, crème fraîche, crumbled cheese, sliced onion and coriander."],
  "m-churros":["Put the water, butter, sugar and a pinch of salt in a pan and bring to the boil. Tip in the flour all at once and beat hard with a wooden spoon until the dough comes away from the sides in a smooth ball.","Let it cool for 5 minutes, then beat in the egg until the dough is glossy and smooth.","Heat the oil to 180°C. Spoon the dough into a piping bag with a large star nozzle and pipe 10 cm lengths straight into the oil, snipping them off with scissors. Fry for 2 to 3 minutes, turning, until deep golden.","Drain briefly and roll the hot churros in the cinnamon sugar.","For the chocolate, whisk the milk with the cornflour, add the chocolate and heat gently, whisking, until thick and glossy. Serve in cups for dipping."],
  "m-birria-ramen":["Toast the dried chilies in a dry pan for a few seconds per side, then soak them in hot water for 15 minutes. Blend with the onion, garlic, tomatoes, spices and vinegar until smooth.","Brown the beef well in a heavy pot. Pour over the chili sauce and 1.5 l water, bring to a simmer, cover and cook gently for about 3 hours, until the meat falls apart.","Lift out the beef and shred it. Skim some of the red fat from the top of the broth and keep it for drizzling. Season the broth with salt.","Cook the noodles, drain them and add them to bowls of the hot broth with the shredded beef.","Drizzle with the red fat and finish with chopped onion, coriander and a squeeze of lime."],
  "m-cauli-tacos":["Heat the oven to 220°C. Toss the cauliflower florets with the oil, smoked paprika, cumin and salt, spread them out on a tray and roast for about 25 minutes, until tender and charred at the edges.","Drain the soaked cashews and blend them with the chipotle, half the lime juice, salt and a splash of water until very smooth and pourable.","Toss the shredded cabbage with the vinegar and a pinch of salt and let it sit while the cauliflower roasts.","Warm the tortillas in a dry pan and fill them with cauliflower, pickled cabbage, a drizzle of chipotle crema and coriander. Squeeze over the rest of the lime."],
  "m-esquites":["Heat a large, dry frying pan until very hot, add the corn and leave it to char for a minute before stirring. Cook for 6 to 8 minutes in total, until blistered and golden in places, then stir in the butter.","Mix the mayonnaise with the lime juice, chili powder and a pinch of salt.","Toss the warm corn with the dressing, chopped onion and coriander.","Spoon into bowls, top with the avocado and crumbled feta, and dust with a little more chili."],
  // Indian
  "n-butter-chicken":["Mix the yogurt with half the garam masala, the chili powder, garlic, ginger and salt, and coat the chicken. Leave it to marinate for at least 30 minutes.","Cook the chicken under a hot grill or in a very hot pan until it's charred in places and just cooked through. The charring gives the dish its smoky, tandoori flavour.","Melt the butter in a pan, add the passata and the rest of the garam masala and simmer for about 10 minutes, until slightly thickened.","Stir in the cream and sugar, then crumble in the dried fenugreek leaves between your fingers.","Add the chicken and simmer for 5 minutes so it absorbs the sauce. Serve with rice or naan."],
  "n-dal":["Rinse the lentils in a sieve until the water runs clear. Put them in a pot with the turmeric, tomato and 1 l water, bring to the boil, skim, and simmer for about 25 minutes, until completely soft. Season with salt and whisk to a creamy consistency.","For the tadka, heat the ghee in a small pan until shimmering. Add the cumin seeds and let them crackle for a few seconds.","Add the garlic, dried chilies and asafoetida and cook until the garlic turns golden. Watch it closely: it goes from golden to burnt very quickly.","Pour the sizzling tadka over the dal. It will hiss and fill the kitchen with its aroma. Finish with coriander and serve with rice."],
  "n-chana":["Heat the oil in a heavy pan and add the cumin seeds. When they sizzle, add the onions and cook over medium heat for about 12 minutes, stirring, until deep golden. Taking your time here gives the curry its rich flavour.","Add the garlic, ginger and chili and cook for a minute, then add the tomatoes and the spice mix. Cook, stirring, until the tomatoes break down and the oil starts to separate from the sauce.","Add the chickpeas and a cup of water and simmer for about 15 minutes. Mash a few chickpeas against the side of the pan to thicken the gravy.","Stir in the amchur for a gentle sourness, season with salt and finish with coriander."],
  "n-palak":["Blanch the spinach in boiling water for 1 minute, then plunge it into iced water so it stays bright green. Squeeze it out and blend until smooth.","Fry the paneer cubes in a little of the ghee until golden on a couple of sides, then set them aside.","Heat the rest of the ghee, add the cumin seeds, then the onion, garlic, ginger and chili, and cook until soft and golden.","Add the spinach purée and garam masala, season with salt and simmer for 5 minutes.","Stir in the cream and the paneer and warm through gently before serving."],
  "n-biryani":["Mix the chicken with the yogurt, biryani masala, chili powder, ginger-garlic paste, half the fried onions and salt. Marinate for at least 1 hour.","Rinse the rice until the water runs clear, then boil it in plenty of salted water with the whole spices until about 70% cooked: the grains should still be firm in the centre. Drain.","Spread the marinated chicken in an even layer in a heavy pot. Cover it with the rice, then scatter over the mint, coriander and remaining fried onions, drizzle with the saffron milk and dot with ghee.","Seal the pot tightly with foil and a lid and cook on the lowest heat for about 40 minutes. The chicken cooks in its own juices and steams the rice from below.","Rest for 10 minutes before opening, then mix gently from the bottom as you serve, so everyone gets chicken and rice."],
  "n-aloo-gobi":["Heat the oil in a wide pan, add the cumin seeds and let them sizzle, then add the onion and cook until soft.","Stir in the ginger, chili, turmeric and ground coriander and cook for a minute.","Add the potatoes and cauliflower with salt and a splash of water, stir to coat them in the spices, cover and cook on low heat for about 20 minutes, stirring gently now and then, until tender.","Take off the lid and turn up the heat for a few minutes so the edges crisp and colour. Finish with garam masala and coriander."],
  "n-moilee":["Rub the fish pieces with the turmeric and a pinch of salt and set them aside.","Heat the coconut oil in a wide pan and add the mustard seeds. When they start to pop, add the curry leaves, onion, ginger and chilies, and cook gently until the onion is soft.","Pour in the coconut milk and bring it to a gentle simmer. Don't let it boil hard, or it may split.","Slide in the fish and tomato slices and poach gently for 6 to 8 minutes, until the fish flakes easily. Season and finish with a squeeze of lime."],
  "n-tikka-tacos":["Mix 100 g of the yogurt with the tikka masala, chili powder and salt, and coat the paneer cubes and pepper chunks. Leave for 20 minutes.","Toss the sliced onion with the lime juice and a pinch of salt and let it soften while the paneer marinates.","Blend the mint, coriander, chili, the remaining yogurt and salt into a smooth green chutney.","Grill or pan-fry the paneer and pepper over high heat until charred at the edges. Warm the tortillas or naan, then fill them and top with the pickled onion and chutney."],
  "n-masala-mac":["Cook the macaroni in salted water until just al dente, then drain.","Melt the butter in a pan, stir in the flour and cook for a minute. Whisk in the milk a little at a time until smooth, then simmer for a few minutes until thick.","Stir in the turmeric, garam masala, chili and cheese until melted and glossy, then fold in the pasta.","Heat the ghee in a small pan, add the cumin seeds and let them sizzle for a few seconds, then pour the tempering over the mac and cheese. Finish with coriander."],
  "n-lassi-pannacotta":["Put the cold cream, sugar and cardamom in a pan and whisk in the agar agar powder before you turn on the heat, so it doesn't clump.","Bring it to the boil, stirring, and let it bubble gently for 1 minute: agar only sets once it has boiled.","Take it off the heat and quickly whisk in the mango purée and yogurt. Work fast, as agar starts to set as it cools.","Pour into glasses and chill for at least 2 hours, until set. Top with chopped pistachios before serving."],
  // Middle Eastern
  "me-arayes":["Grate the onion and squeeze out as much juice as you can with your hands. Mix it with the meat, parsley, spices and salt, kneading until sticky.","Cut each pita in half to make two pockets. Open them carefully and spread a thin, even layer of meat inside, right to the edges, so it cooks through at the same time as the bread crisps.","Brush the outside of the pitas with olive oil.","Cook in a hot griddle pan, or in the oven at 220°C, for 12 to 15 minutes, turning once, until the bread is crisp and golden and the meat is cooked through.","Cut into wedges and serve hot with tahini sauce or yogurt."],
  "me-maqluba":["Put the chicken in a pot with the onion, cinnamon, cardamom, salt and 1.5 l water. Simmer for about 40 minutes, then lift out the chicken and keep the broth.","Meanwhile, fry the aubergine slices, cauliflower and potato in hot oil, in batches, until golden. Drain on kitchen paper.","Drain the soaked rice and mix it with the seven spice and turmeric. In a deep, heavy pot, make a layer of chicken, then the fried vegetables, then the rice, pressing it down lightly.","Pour hot broth over the top until it covers the rice by about 2 cm. Bring to a simmer, then cover and cook on very low heat for 30 minutes. Rest for 10 minutes with the lid on.","Put a large tray on top of the pot and flip it over in one confident move. Tap the pot, lift it away and you have a golden dome. Scatter with toasted nuts and serve with yogurt."],
  "me-musakhan":["Rub the chicken with half the sumac, the seven spice, cumin, salt and a little oil. Roast at 200°C for about 45 minutes, until golden and cooked through.","Meanwhile, cook the sliced onions very slowly in the rest of the olive oil with the remaining sumac and a pinch of salt, for about 25 minutes, until soft, sweet and stained purple.","Lay the flatbreads on a tray and brush them generously with the oniony oil from the pan, then spread the onions on top.","Place the chicken on the onions and warm in the oven for 5 minutes, so the bread crisps at the edges.","Scatter with toasted pine nuts and a final dusting of sumac and serve while warm."],
  "me-hummus":["If you're using tinned chickpeas, warm them in their liquid for a few minutes, then drain. Warm chickpeas blend much smoother.","Blend the chickpeas with the garlic and lemon juice until they form a crumbly paste.","Add the tahini and cumin and blend again, then add the ice-cold water a spoonful at a time, with the blender running, until the hummus turns pale, smooth and fluffy. This can take a few minutes. Season with salt.","Spread it in a shallow bowl, making a swirl with the back of a spoon, and fill the dip with olive oil. Finish with paprika, a few whole chickpeas and chopped parsley."],
  "me-falafel":["Drain the soaked chickpeas and dry them well. They must be soaked but raw: cooked or tinned chickpeas make falafel that falls apart.","Put them in a food processor with the onion, garlic, herbs, spices and salt and pulse until finely chopped, like coarse sand that holds together when pressed. Stir in the baking soda.","Shape the mixture into small patties or balls with wet hands, pressing firmly.","Heat the oil to 175°C and fry the falafel in batches for 3 to 4 minutes, until deep brown and crisp outside and green and fluffy inside.","Drain on kitchen paper and serve in warm pita with tahini sauce and salad."],
  "me-fattoush":["Tear the pitta into bite-sized pieces, toss with 3 tbsp of the oil and spread on a tray. Bake at 200°C for about 8 minutes, until golden and crisp.","Chop the cucumber, tomatoes, lettuce, radishes and spring onions into bite-sized pieces, and roughly tear the mint and parsley.","Whisk the lemon juice, pomegranate molasses, sumac, the remaining oil and a pinch of salt into a tangy dressing.","Just before serving, toss the vegetables and herbs with the dressing, then fold in the crispy pitta so it stays crunchy."],
  "me-baba":["Prick the aubergines a few times and char them directly over a gas flame, on a barbecue or under a very hot grill, turning, for about 20 minutes, until the skin is blackened and the flesh completely soft. The charring gives the dip its smoky flavour.","Let them cool slightly, then split them open and scoop the flesh into a sieve. Leave it to drain for 10 minutes so the dip isn't watery.","Mash the flesh with a fork and stir in the tahini, lemon juice, garlic and salt.","Spread it in a bowl, drizzle with olive oil and scatter with pomegranate seeds and parsley."],
  "me-mujaddara":["Rinse the lentils and boil them in plenty of water for about 15 minutes, until almost tender but still holding their shape. Drain.","Meanwhile, cook the sliced onions in the olive oil over medium heat, stirring often, for 20 to 25 minutes, until deep brown and crisp. Be patient: the dark, sweet onions are the heart of the dish. Lift out half and drain them on kitchen paper.","Add the rinsed rice, cumin, salt and lentils to the remaining onions and oil, stir, and pour in 500 ml water. Bring to a boil, cover and cook on low heat for about 20 minutes, until the rice is tender.","Rest for 5 minutes, fluff with a fork and pile onto a platter. Top with the crispy onions and serve with salad or yogurt."],
  "me-shawarma":["Mix the yogurt, olive oil, lemon juice, garlic, cumin, paprika, turmeric, cinnamon and salt, and coat the chicken thighs well. Marinate for at least 1 hour, or overnight in the fridge.","Heat the oven to 220°C. Spread the chicken on a tray and roast for about 25 minutes, then put it under a hot grill for a few minutes, until charred at the edges.","Let it rest for 5 minutes, then slice it thinly.","Warm the flatbreads and fill them with the chicken, garlic sauce, pickles, tomato and parsley. Roll them up tightly and serve."],
  "me-knafeh":["Make the syrup first: simmer the sugar, water and lemon juice for about 8 minutes, until slightly thickened. Stir in the orange blossom water and let it cool completely.","Pull the kataifi apart and chop it into short strands. Mix it with the melted butter until every strand is coated, and press half of it very firmly into a 26 cm pan.","Drain and pat dry the soaked cheese, mix it with the ricotta and spread it over the pastry, leaving a small border. Cover with the rest of the kataifi and press down.","Bake at 190°C for about 35 minutes, until deep golden. Turn it out onto a plate, pour over the cool syrup and scatter with pistachios. Serve warm, while the cheese is stretchy."],
  "me-tabbouleh":["Rinse the bulgur and put it in a bowl with the juice of 1 lemon and 2 tbsp water. Leave it for about 15 minutes to soften.","Meanwhile, wash and dry the parsley and mint well, then chop them very finely with a sharp knife. A blunt knife or food processor bruises the herbs and makes them soggy.","Mix the herbs with the tomatoes, spring onions and bulgur.","Dress with the olive oil, the remaining lemon juice, allspice and salt, and serve straight away. It should be mostly green, with just a little bulgur."],
  "me-freekeh":["Heat the oil in a pot and soften the onion for 5 minutes. Add the chicken and seven spice and cook until the chicken is lightly browned.","Add the rinsed freekeh and the stock, bring to a boil, then lower the heat and simmer for about 35 minutes, until the grains are tender and the soup has thickened.","Season with salt and stir in lemon juice to taste.","Ladle into bowls and scatter with chopped parsley."]
});
Object.assign(LONG_STEPS, {
  // Italian winter specials
  "s-tortellini":["Pour the broth into a pot and bring it slowly to a gentle simmer. Taste and season with salt: the broth is the star here, so it should taste rich and rounded.","Drop in the tortellini and stir once so they don't stick. Keep the broth at a gentle simmer, not a rolling boil, which can burst the delicate pasta.","Cook for 3 to 4 minutes, until the tortellini float to the surface and are tender.","Ladle the tortellini and plenty of broth into warm bowls and grate over Parmigiano at the table."],
  "s-ribollita":["Warm the oil in a large pot and cook the chopped carrots, celery and onion over low heat for about 10 minutes, until soft. Stir in the tomato paste and cook for a minute.","Add the cavolo nero, savoy cabbage and potatoes and stir until the leaves start to wilt.","Pour in the stock and add half the beans. Blend the other half with a ladle of the liquid and stir it in to thicken the soup. Simmer gently for about 1 hour, until everything is very soft.","Layer slices of stale bread and ladles of soup in a pot or deep dish and leave it to soak, overnight if you can.","Reheat the next day until bubbling, stirring so the bread breaks down into a thick, spoonable soup. Serve with a generous drizzle of your best olive oil."],
  "s-cotechino":["Prick the cotechino all over with a fork, put it in a pot of cold water and bring it slowly to a simmer. Cook gently for about 2½ hours. If yours is pre-cooked, follow the packet, usually 20 minutes in its bag.","Meanwhile, warm the oil and soften the finely chopped onion, carrot and celery for about 8 minutes.","Add the rinsed lentils and tomato paste, stir, then pour in the stock. Simmer for about 35 minutes, until the lentils are tender and the liquid has mostly been absorbed. Season with salt.","Lift out the cotechino, let it rest for a few minutes, then peel off the skin and cut it into thick slices.","Spoon the lentils onto a warm platter and arrange the slices on top. Eat it just after midnight for luck in the new year."],
  "s-zucca":["Melt half the butter in a wide pan and soften the shallot for 3 minutes. Add the diced pumpkin and cook over medium heat, stirring, for about 10 minutes, until it starts to break down into a golden mush.","Add the rice and stir for 2 minutes to toast it, then pour in the wine and let it evaporate.","Add the hot stock a ladle at a time, stirring often and letting each ladle be absorbed before the next. Keep going for about 17 minutes, until the rice is tender with a little bite. The pumpkin melts into the rice and makes it creamy.","Meanwhile, fry the sage leaves in the remaining butter in a small pan until crisp and the butter smells nutty.","Take the risotto off the heat, stir in the Parmigiano and rest it for a minute. Serve topped with the crisp sage and a spoon of the sage butter."],
  "s-polenta":["Bring the salted water to the boil in a heavy pot. Pour in the polenta in a thin, steady stream, whisking all the time so no lumps form.","Turn the heat to low and cook, stirring often with a wooden spoon, for about 40 minutes, or as long as the packet says. It's ready when it's thick, smooth and pulls away from the sides of the pot.","Meanwhile, heat the oil in a wide pan over high heat and add the mushrooms in a single layer. Leave them to brown before stirring, then add the garlic and thyme and cook until golden. Season with salt and pepper.","Beat the butter and Parmigiano into the polenta until glossy.","Spoon the polenta onto warm plates, make a hollow in the middle and fill it with the mushrooms. Finish with chopped parsley."],
  "s-rinforzo":["Boil the cauliflower florets in salted water for about 6 minutes, so they're tender but still have some crunch. Drain and spread them out to cool.","Put the cauliflower in a large bowl with the pickled peppers, olives, capers and the anchovies torn into pieces.","Whisk the oil, vinegar and a pinch of salt and pour it over.","Toss gently and leave the salad for at least an hour, so the cauliflower soaks up the dressing. It's meant to sit and gets better over the holidays."],
  "s-struffoli":["Mix the flour, eggs, soft butter, sugar, lemon zest and limoncello and knead into a soft, smooth dough. Wrap it and rest for 30 minutes.","Cut off pieces of dough and roll them into ropes about as thick as a pencil, then cut them into small pieces the size of a chickpea.","Heat the oil to 175°C and fry the struffoli in batches for 1 to 2 minutes, stirring, until golden. Drain them on kitchen paper.","Warm the honey gently in a wide pan until runny, take it off the heat and tip in the struffoli. Stir until every piece is coated.","Pile them onto a plate in a mound or a ring, using wet hands to shape them, and decorate with sprinkles and candied fruit. They hold together as the honey cools."],
  "s-panforte":["Heat the oven to 150°C and line a 20 cm tin with baking paper.","In a large bowl, mix the toasted nuts, candied peel, flour and spices.","Heat the honey and sugar in a pan, stirring until the sugar dissolves, then let it bubble until it reaches 115°C on a thermometer, or until a drop in cold water forms a soft ball.","Pour the hot syrup over the dry mix and stir quickly with a wooden spoon. Press it into the tin with wet hands, as it gets stiff fast.","Bake for about 30 minutes. It will still feel soft but firms up as it cools. Leave it to cool completely, then dust with icing sugar and cut into thin wedges."],
  "s-castagnaccio":["Heat the oven to 190°C and brush a 26 cm tin with olive oil.","Sift the chestnut flour into a bowl to remove any lumps, then whisk in the water and a pinch of salt little by little until you have a smooth batter, about as thick as pancake batter.","Pour it into the tin; it should be only about 1 cm deep. Scatter over the pine nuts, drained raisins and rosemary leaves and drizzle with oil.","Bake for about 35 minutes, until the top is dry and crackled. Serve warm or at room temperature."],
  // Dishes inspired by Cucina con Ruben, in our own words
  "r-ravioli":["Pile the flour on a board, make a well in the middle and crack in the eggs. Beat them with a fork, gradually drawing in the flour, then knead for about 8 minutes until smooth and elastic. Wrap and rest for 30 minutes.","Drain the stracciatella well in a sieve, then mix it with the Parmigiano. A dry filling keeps the ravioli from going soggy.","Roll the dough into thin sheets. Place small spoonfuls of filling along one sheet, cover with a second, press around each mound to push out the air and cut into squares.","Warm the oil with the garlic in a wide pan, add the tomatoes and cook for about 5 minutes until they soften and release their juices. Add the olives.","Cook the ravioli in salted boiling water for about 3 minutes, lift them out with a slotted spoon and toss them gently in the sauce with torn basil."],
  "r-gnocchetti":["Heat the oven to 210°C. Toss the aubergine and tomatoes with half the oil and some salt, spread them on a tray and roast for about 20 minutes, until the aubergine is golden and the tomatoes blister.","Cook the gnocchetti in salted boiling water until al dente, and keep a cup of the cooking water.","Warm the sliced garlic in the remaining oil, add the pasta, roasted vegetables and a splash of cooking water, and toss until the sauce turns creamy and coats the pasta.","Serve in bowls with spoonfuls of cold stracciatella and basil on top. The contrast of hot and cold is the point."],
  "r-polpette-melanzane":["Roast the whole aubergines at 200°C for about 35 minutes, until collapsed and soft. Halve them, scoop out the flesh and let it drain in a sieve for 15 minutes.","Mash the flesh with the breadcrumbs, pecorino, egg, half the garlic, parsley and salt. It should hold together when squeezed; add more breadcrumbs if it's too wet.","Shape small balls with wet hands and fry them in hot oil until golden, or bake them on an oiled tray at 200°C for about 20 minutes, turning once.","For the sauce, squeeze the grated cucumber dry and mix it with the yogurt, lemon juice, the rest of the garlic and salt. Serve the polpette warm with the cool sauce."],
  "r-puccia":["Mix the flour, yeast, warm water and salt and knead into a soft, slightly sticky dough. Cover and leave it to rise for about an hour, until doubled.","Divide into 4, shape round flat breads about 1 cm thick and rest them for 20 minutes. Bake at 230°C for about 12 minutes, until puffed and pale golden.","Meanwhile, mix the beef with the cumin, paprika, egg, breadcrumbs and salt, roll into small balls and fry them in a pan until browned and cooked through.","Split the warm breads open and fill them with the meatballs, tomato slices and rocket."],
  "r-torta-salmone":["Heat the oven to 190°C and line a tart tin with the puff pastry, letting it come up the sides. Prick the base with a fork.","Scatter the diced mozzarella and torn smoked salmon evenly over the base.","Whisk the eggs with the cream, chopped dill and black pepper. The salmon is salty, so add only a little salt.","Pour the mixture over the filling and bake for about 35 minutes, until set in the middle and golden on top. Let it rest for 10 minutes before slicing."],
  "r-cheesecake-pandoro":["Line the base and sides of a 22 cm springform tin with slices of pandoro, pressing them together so there are no gaps.","Whip the cream to soft peaks. In another bowl, beat the cream cheese with the icing sugar and lemon zest until smooth, then fold in the whipped cream.","Spread the filling over the pandoro and smooth the top.","Rub the biscuits with the melted butter into crumbs and toast them in a dry pan for a few minutes until golden. Cool.","Scatter the crumble and toasted almonds over the cheesecake and chill for at least 4 hours before releasing it from the tin."],
  "r-lasagne-cicoria":["Boil the chicory in salted water for about 8 minutes, drain, squeeze out the water and chop it roughly. Sauté it with the garlic and oil for a few minutes.","Heat the oven to 190°C. Spread a thin layer of béchamel in a baking dish.","Layer pasta sheets, chicory, béchamel and pecorino, and repeat about five times.","Finish with béchamel and a good handful of pecorino, and bake for about 35 minutes, until golden and bubbling. Rest for 10 minutes before cutting."],
  "r-crostata-pesche":["Rub the cold butter into the flour and ground almonds until it looks like breadcrumbs, then add the sugar and egg and bring it together into a dough. Wrap and chill for 30 minutes.","Heat the oven to 180°C. Roll out two thirds of the pastry and line a 24 cm tart tin.","Spread the peach jam over the base. Roll out the rest of the pastry, cut strips and lay them over the top in a lattice, then scatter with flaked almonds.","Bake for about 35 minutes, until golden. Cool completely before slicing so the jam sets."],
  "r-crudaiola":["Dice the tomatoes and put them in a large bowl with the crushed garlic, torn basil, oil and a good pinch of salt. Leave them for 15 minutes, so the tomatoes release their juices into the oil.","Cook the spaghetti in salted boiling water until al dente.","Drain the pasta and tip it straight into the bowl with the cubed Brie, tossing well. The heat of the pasta melts the cheese into the raw sauce.","Fish out the garlic clove and serve straight away."],
  "r-pasta-broccoli":["Bring a pot of salted water to the boil and cook the broccoli for 4 minutes. Lift it out, then cook the pasta in the same water until just short of al dente.","Warm the oil with the garlic and chili in a pan, add the broccoli and cook for a few minutes, crushing it slightly with a spoon so it becomes almost a sauce.","Heat the oven to 200°C. Mix the pasta with the broccoli, béchamel and diced scamorza and spread it in a baking dish. Scatter Parmigiano over the top.","Bake for about 20 minutes, until golden and crisp on top and melting underneath."],
  "r-ortolana":["Dice all the vegetables into small, even pieces so they cook at the same speed.","Warm the oil in a large pan and cook the aubergine and pepper for about 8 minutes, until soft and golden. Add the courgette and garlic, then the tomatoes, and cook for 5 minutes more.","Cook the linguine until al dente and add them to the pan with a splash of cooking water. Toss well over the heat.","Finish with torn basil and a drizzle of olive oil."],
  "r-panzanella-fagioli":["Tear the bread into chunks, sprinkle it with a little water and the vinegar, and leave it for about 5 minutes to soften.","Halve the tomatoes and slice the onion and cucumber.","Put everything in a big bowl with the beans, oil, salt and torn basil and toss gently with your hands.","Rest for 15 minutes before serving so the bread soaks up the juices."],
  "r-tagliolini-salmone":["Melt a little of the truffle butter in a wide pan and soften the chopped shallot for 2 minutes. Add the salmon strips and stir for a minute.","Pour in the whisky, standing back, and let it bubble until the alcohol has evaporated.","Add the cream and simmer for 2 minutes, until slightly thickened.","Cook the tagliolini for about 2 minutes, then lift them into the sauce with the rest of the truffle butter and a splash of cooking water. Toss gently and finish with chives."],
  "r-piselli":["Warm the oil in a pan and soften the shallot for 3 minutes. Add the peas and a ladle of water and simmer for about 8 minutes, until tender.","Blend the peas with half the pecorino, the mint and enough cooking liquid to make a smooth, bright green cream.","Cook the spaghetti until al dente and toss them with the pea cream and a little pasta water until glossy.","Serve topped with the chopped pistachios and the rest of the pecorino."],
  "r-frittata-zucca":["Warm the oil in a 24 cm non-stick pan and add the pumpkin, potato and onion with a pinch of salt. Cover and cook over medium-low heat for about 12 minutes, stirring now and then, until soft.","Beat the eggs with the Parmigiano, chopped rosemary and salt, and pour them over the vegetables.","Cover and cook on low heat for about 8 minutes, until almost set.","Flip the frittata with the help of a plate and cook for 2 minutes more. Serve warm or at room temperature."],
  "r-burger-lenticchie":["Mash the lentils roughly with a fork, then mix in the breadcrumbs, egg, cumin and salt. Shape four patties and chill them for 15 minutes so they hold together.","Boil the chicory for about 6 minutes, squeeze out the water and sauté it with the garlic and a little oil.","Fry the burgers in the remaining oil over medium heat for about 4 minutes per side, until crisp outside.","Toast the buns and fill them with the burgers, chicory and shaved pecorino."],
  "r-sgombro":["Warm a spoonful of the oil from the mackerel tin in a wide pan with the garlic and chili, then add the tomatoes and cook for about 5 minutes, until soft.","Flake in the mackerel and add the capers, stirring gently so the fish stays in pieces.","Cook the pasta until al dente and toss it into the pan with a splash of cooking water.","Serve topped with toasted breadcrumbs and parsley, which add crunch in place of cheese."],
  "r-risotto-pomodorini":["Toss the cherry tomatoes with the oil and some salt and roast at 200°C for about 25 minutes, until soft and caramelised.","Soften the shallot in a little oil, add the rice and toast it for 2 minutes, then pour in the wine and let it evaporate.","Add the hot stock a ladle at a time, stirring often, for about 17 minutes, until the rice is tender and creamy.","Take the pan off the heat and stir in the butter.","Spoon into bowls and top with the roasted tomatoes, anchovy fillets and a spoonful of cold stracciatella."],
  "r-tagliolini-cavolfiore":["Simmer the cauliflower and shallot in the stock for about 15 minutes, until very soft, then blend until silky smooth.","Cook the tagliolini for about 2 minutes, drain and toss them in the warm cauliflower cream with the truffle butter.","Divide between plates and tear the smoked burrata over the top.","Finish with a twist of black pepper."],
  "r-carrozza":["Make four sandwiches with the bread and mozzarella. The cheese should be well drained and patted dry, or it will make the bread soggy. Press the edges firmly together.","Dip each sandwich in flour on both sides, then in the eggs beaten with the milk, letting them soak for a few seconds.","Heat the oil in a frying pan and fry the sandwiches over medium heat until golden on both sides and the cheese inside has melted.","Drain on kitchen paper, sprinkle with salt and eat hot."],
  "r-tenerina":["Heat the oven to 170°C and line a 24 cm tin. Melt the chocolate and butter together and let it cool slightly.","Whisk the egg yolks with the sugar until pale, then stir in the melted chocolate and the flour.","Whisk the egg whites to soft peaks and fold them gently into the chocolate mixture.","Bake for about 25 minutes. The top should form a thin crust while the centre stays soft and almost molten. Cool in the tin and dust with icing sugar."],
  "r-cavolo-nero":["Strip the leaves of the cavolo nero from the tough stalks and boil them in salted water for about 5 minutes.","Blend the leaves with the garlic, oil, Parmigiano and a little cooking water into a smooth, deep green sauce.","Cook the spaghetti in the same water until al dente and toss them with the sauce.","Serve topped with torn burrata and a pinch of chili flakes."],
  "r-cous-cous":["Put the couscous in a bowl, pour over the boiling salted water, cover and leave for 5 minutes. Fluff it up with a fork.","Sauté the diced courgette and pepper in a little oil until just tender, then mix them into the couscous with the almonds and raisins.","Blend the tomatoes, cucumber, garlic, vinegar and most of the oil until smooth, season with salt and chill.","Pour the cold gazpacho into shallow bowls and pile the couscous in the middle."],
  "r-insalatona":["Slice the apple and fennel as thinly as you can.","Toast the walnuts in a dry pan for a few minutes until fragrant.","Whisk the lemon juice, oil, honey and a pinch of salt into a dressing.","Toss the leaves, apple and fennel with the dressing and top with crumbled goat's cheese and walnuts."],
  "r-tortino":["Heat the oven to 200°C. Butter four ramekins and dust them with cocoa so the puddings turn out easily.","Melt the chocolate and butter together. Whisk the eggs, yolks and sugar until thick and pale, fold in the chocolate, then the flour.","Half-fill the ramekins, add a few pieces of torrone to each, and top with the remaining mixture.","Bake for 10 to 11 minutes, until the edges are firm but the centre still wobbles. Turn them out straight away and serve warm."],
  "r-peperoni":["Roast the whole peppers at 220°C for about 25 minutes, turning once, until blistered and soft. Put them in a bowl, cover and let them steam for 10 minutes, then peel, seed and slice them.","Warm the garlic in the oil, add the peppers, capers and olives and cook for a few minutes.","Cook the linguine until al dente and toss them in the pan with a little pasta water.","Finish with chopped parsley."],
  "r-risotto-arancia":["Soften the shallot in a little of the butter, add the rice and toast it for 2 minutes, then add the wine and let it evaporate.","Add the hot stock a ladle at a time, stirring often, for about 17 minutes, until the rice is tender.","Take it off the heat and beat in the rest of the butter, the Parmigiano, the finely grated orange zest and a splash of orange juice. Taste: the orange should be fresh, not overpowering.","Serve with bottarga grated over the top at the table."],
  "r-patate-dolci":["Heat the oven to 220°C. Cut the sweet potatoes into wedges and toss them with the cornflour, oil and salt. The cornflour helps them crisp.","Spread them out on a tray without crowding and roast for about 30 minutes, turning once, until crisp at the edges.","Stir the smoked paprika into the mayonnaise. Mix the yogurt with the chives, lemon juice and salt.","Serve the wedges hot with both dips on the side."],
  "r-gnocchi-ricotta":["Mix the drained ricotta with the egg yolk, Parmigiano and flour into a soft dough. Roll it into ropes on a floured board and cut into small gnocchi.","Cook the courgettes and shallot in the oil until soft, then blend them with a little water into a smooth cream. Season with salt.","Boil the gnocchi in salted water and lift them out as soon as they float.","Toss them gently in the warm courgette cream and serve topped with stracciatella and anchovies."],
