const RUBEN = [
  {id:"r-ravioli",u:"ravioli-di-stracciatella-con-pomodori-e-olive-taggiasche",t:"Ravioli di stracciatella con pomodori e olive taggiasche",c:"primi",k:"Mains",m:75,s:4,a:"ravioli",d:"Fresh egg pasta filled with creamy stracciatella, tossed with sautéed cherry tomatoes and small Ligurian olives.",i:"300 g 00 flour|3 eggs|250 g stracciatella, drained|30 g Parmigiano, grated|300 g cherry tomatoes, halved|50 g taggiasca olives|1 clove garlic|3 tbsp olive oil|1 handful basil",p:"Knead the flour and eggs into a smooth dough, wrap it and rest for 30 minutes.|Mix the stracciatella with the Parmigiano. Roll the dough thin, dot with filling, fold over and cut into ravioli, pressing out the air.|Sauté the tomatoes with the garlic and oil for 5 minutes, then add the olives.|Boil the ravioli for 3 minutes and toss them gently in the sauce with basil."},
  {id:"r-gnocchetti",u:"gnocchetti-sardi-cremosi-con-stracciatella-pomodorini-e-melanzane",t:"Gnocchetti sardi con stracciatella, pomodorini e melanzane",c:"primi",k:"Mains",m:35,s:4,r:"Sardegna",a:"norma",d:"Ridged Sardinian pasta with roasted aubergine and cherry tomatoes, finished with a spoonful of cold stracciatella.",i:"320 g gnocchetti sardi|1 aubergine, cubed|250 g cherry tomatoes|1 clove garlic, sliced|200 g stracciatella|4 tbsp olive oil|1 handful basil|Salt",p:"Roast the aubergine and tomatoes with half the oil and some salt at 210°C for 20 minutes.|Cook the pasta and drain it, keeping a cup of the water.|Warm the garlic in the remaining oil, add the pasta, vegetables and a splash of water and toss until creamy.|Serve topped with stracciatella and basil."},
  {id:"r-polpette-melanzane",u:"polpette-di-melanzane-con-salsa-tzatziki",t:"Polpette di melanzane con salsa tzatziki",c:"antipasti",k:"Starters",m:50,s:4,a:"fried",d:"Crisp aubergine and pecorino balls served with a cool, garlicky yogurt sauce.",i:"2 aubergines|80 g breadcrumbs|50 g pecorino, grated|1 egg|1 clove garlic, grated|1 handful parsley, chopped|200 g Greek yogurt|1/2 cucumber, grated|1 tbsp lemon juice|Oil for frying",p:"Roast the whole aubergines at 200°C for 35 minutes, then scoop out the flesh and let it drain.|Mash it with the breadcrumbs, pecorino, egg, half the garlic and the parsley, and shape small balls.|Fry or bake them until golden.|Squeeze the cucumber and mix it with the yogurt, lemon and remaining garlic. Serve with the polpette."},
  {id:"r-puccia",u:"puccia-salentina-con-polpette-speziate",t:"Puccia salentina con polpette speziate",c:"secondi",k:"Mains",m:90,s:4,r:"Puglia",a:"puccia",d:"Salento's soft, airy flatbread split open and filled with spiced meatballs, tomato and rocket.",i:"400 g bread flour|1 tsp dried yeast|280 ml warm water|1 tsp salt|400 g minced beef|1 tsp ground cumin|1 tsp sweet paprika|1 egg|30 g breadcrumbs|2 tomatoes, sliced|1 handful rocket",p:"Mix the flour, yeast, water and salt into a soft dough and let it rise for 1 hour.|Shape 4 rounds, rest them for 20 minutes and bake at 230°C for 12 minutes, until puffed and pale gold.|Mix the beef with the spices, egg and breadcrumbs, roll into small balls and pan-fry until cooked.|Split the warm bread and fill with meatballs, tomato and rocket."},
  {id:"r-torta-salmone",u:"torta-salata-con-salmone-e-mozzarella",t:"Torta salata con salmone e mozzarella",c:"secondi",k:"Mains",m:55,s:6,a:"quiche",d:"A savoury puff pastry tart with smoked salmon, mozzarella and a creamy egg filling.",i:"1 sheet puff pastry|150 g smoked salmon|200 g mozzarella, diced|3 eggs|150 ml cream|1 handful dill|Black pepper",p:"Heat the oven to 190°C and line a tart tin with the pastry.|Scatter the mozzarella and torn salmon over the base.|Whisk the eggs, cream, dill and pepper and pour over.|Bake for 35 minutes until set and golden."},
  {id:"r-cheesecake-pandoro",u:"cheesecake-al-pandoro-con-mandorle-e-crumble-di-biscotto",t:"Cheesecake al pandoro con mandorle e crumble",c:"dolci",k:"Desserts",m:270,s:8,a:"cheesecake",d:"A no-bake cheesecake on a pandoro base, topped with toasted almonds and biscuit crumble. Good for leftover Christmas pandoro.",i:"250 g pandoro, sliced|500 g cream cheese|250 ml cream|80 g icing sugar|1 lemon, zest only|100 g dry biscuits|40 g butter, melted|40 g flaked almonds, toasted",p:"Line a 22 cm tin with slices of pandoro, pressing them together.|Whip the cream, then fold in the cream cheese, icing sugar and zest, and spread it over the pandoro.|Rub the biscuits with the butter into crumbs and toast them in a pan.|Top with the crumble and almonds and chill for 4 hours."},
  {id:"r-lasagne-cicoria",u:"lasagne-cicoria-e-pecorino",t:"Lasagne cicoria e pecorino",c:"primi",k:"Mains",m:80,s:6,r:"Lazio",a:"lasagneG",d:"White lasagne layered with bitter chicory, béchamel and sharp pecorino.",i:"400 g fresh lasagne sheets|800 g chicory|2 cloves garlic|3 tbsp olive oil|800 ml béchamel|120 g pecorino, grated",p:"Boil the chicory for 8 minutes, squeeze it and sauté with the garlic and oil.|Heat the oven to 190°C. Layer béchamel, pasta, chicory and pecorino in a dish, five times over.|Finish with béchamel and pecorino.|Bake for 35 minutes and rest for 10 before cutting."},
  {id:"r-crostata-pesche",u:"crostata-con-confettura-di-pesche-e-mandorle",t:"Crostata con confettura di pesche e mandorle",c:"dolci",k:"Baking",m:70,s:8,a:"peachtart",d:"An almond shortcrust tart filled with peach jam and scattered with flaked almonds.",i:"250 g plain flour|50 g ground almonds|130 g cold butter|100 g sugar|1 egg|350 g peach jam|30 g flaked almonds",p:"Rub the butter into the flour and ground almonds, add the sugar and egg and bring together. Chill for 30 minutes.|Heat the oven to 180°C and line a 24 cm tin with two thirds of the pastry.|Spread with the jam, add a lattice from the rest and scatter with almonds.|Bake for 35 minutes and cool before slicing."},
  {id:"r-crudaiola",u:"spaghetti-alla-crudaiola-con-brie-e-pomodoro-fresco",t:"Spaghetti alla crudaiola con Brie e pomodoro fresco",c:"primi",k:"Mains",m:20,s:4,a:"crudaiola",d:"A no-cook summer sauce of raw tomatoes, basil and melting Brie, tossed with hot spaghetti.",i:"320 g spaghetti|500 g ripe tomatoes, diced|150 g Brie, cubed|1 clove garlic, crushed|1 handful basil|5 tbsp extra virgin olive oil|Salt",p:"Mix the tomatoes, garlic, basil, oil and salt in a big bowl and leave for 15 minutes.|Cook the spaghetti until al dente.|Drain and toss it straight into the bowl with the Brie so it starts to melt.|Take out the garlic and serve."},
  {id:"r-pasta-broccoli",u:"pasta-e-broccoli-al-forno-con-scamorza-affumicata",t:"Pasta e broccoli al forno con scamorza affumicata",c:"primi",k:"Mains",m:50,s:4,r:"Campania",a:"orecchiette",d:"Baked pasta with broccoli and smoky scamorza, crisp on top and creamy underneath.",i:"320 g short pasta|500 g broccoli florets|1 clove garlic|1 dried chili|3 tbsp olive oil|200 g smoked scamorza, diced|40 g Parmigiano, grated|300 ml béchamel",p:"Boil the broccoli for 4 minutes, then cook the pasta in the same water.|Sauté the broccoli with the garlic, chili and oil, crushing it a little.|Mix the pasta, broccoli, béchamel and scamorza in a dish and top with Parmigiano.|Bake at 200°C for 20 minutes until golden."},
  {id:"r-ortolana",u:"linguine-all-ortolana",t:"Linguine all'ortolana",c:"primi",k:"Mains",m:30,s:4,a:"ortolana",d:"Linguine with a garden's worth of sautéed vegetables: courgette, pepper, aubergine and cherry tomatoes.",i:"320 g linguine|1 courgette|1 red pepper|1/2 aubergine|200 g cherry tomatoes|1 clove garlic|4 tbsp olive oil|1 handful basil",p:"Dice the vegetables small.|Sauté the aubergine and pepper in the oil for 8 minutes, add the courgette and garlic, then the tomatoes for 5 minutes.|Cook the linguine and toss it in the pan with a splash of water.|Finish with basil and a drizzle of oil."},
  {id:"r-panzanella-fagioli",u:"panzanella-estiva-di-fagioli",t:"Panzanella estiva di fagioli",c:"antipasti",k:"Salads",m:20,s:4,r:"Toscana",a:"panzanella",d:"A summer bread salad bulked up with cannellini beans, cherry tomatoes and red onion.",i:"200 g stale bread|400 g cooked cannellini beans|300 g cherry tomatoes|1/2 red onion|1 cucumber|1 handful basil|4 tbsp extra virgin olive oil|2 tbsp red wine vinegar",p:"Tear the bread, sprinkle it with water and the vinegar and leave for 5 minutes.|Halve the tomatoes and slice the onion and cucumber.|Toss everything with the beans, oil, salt and basil.|Rest for 15 minutes before serving."},
  {id:"r-tagliolini-salmone",u:"tagliolini-al-salmone-affumicato-al-whisky-con-burro-al-tartufo",t:"Tagliolini al salmone, whisky e burro al tartufo",c:"primi",k:"Mains",m:20,s:4,a:"salmonpasta",d:"Fine egg ribbons with smoked salmon flambéed in whisky and a knob of truffle butter.",i:"300 g fresh tagliolini|150 g smoked salmon, in strips|1 shallot, chopped|30 ml whisky|100 ml cream|30 g truffle butter|1 handful chives",p:"Soften the shallot in a little of the truffle butter, add the salmon and pour in the whisky. Let it evaporate.|Add the cream and simmer for 2 minutes.|Cook the tagliolini for 2 minutes, then toss in the sauce with the rest of the truffle butter.|Finish with chives."},
  {id:"r-piselli",u:"spaghetti-con-crema-di-piselli-pecorino-e-pistacchi",t:"Spaghetti con crema di piselli, pecorino e pistacchi",c:"primi",k:"Mains",m:25,s:4,a:"peapasta",d:"A bright green pea cream with pecorino, finished with crunchy chopped pistachios.",i:"320 g spaghetti|300 g peas|1 shallot|3 tbsp olive oil|50 g pecorino, grated|40 g pistachios, chopped|1 handful mint",p:"Soften the shallot in the oil, add the peas and a ladle of water and cook for 8 minutes.|Blend to a smooth cream with half the pecorino and the mint.|Toss with the cooked spaghetti and some pasta water.|Serve with the pistachios and the rest of the pecorino."},
  {id:"r-frittata-zucca",u:"frittata-di-zucca-e-patate",t:"Frittata di zucca e patate",c:"secondi",k:"Breakfast",m:35,s:4,a:"frittataZ",d:"A thick frittata with soft pumpkin and potato, scented with rosemary.",i:"6 eggs|250 g pumpkin, diced|1 potato, diced|1 onion, sliced|40 g Parmigiano, grated|1 sprig rosemary|3 tbsp olive oil",p:"Cook the pumpkin, potato and onion in the oil, covered, for 12 minutes until soft.|Beat the eggs with the Parmigiano, chopped rosemary and salt and pour over.|Cook gently with a lid for 8 minutes.|Flip and cook for 2 minutes more."},
  {id:"r-burger-lenticchie",u:"hamburger-di-lenticchie-con-cicoria-e-pecorino",t:"Hamburger di lenticchie con cicoria e pecorino",c:"secondi",k:"Mains",m:40,s:4,a:"lentilburger",d:"Hearty lentil burgers with bitter sautéed chicory and shavings of pecorino.",i:"400 g cooked lentils|60 g breadcrumbs|1 egg|1 tsp ground cumin|300 g chicory|1 clove garlic|40 g pecorino, shaved|4 burger buns|3 tbsp olive oil",p:"Mash the lentils with the breadcrumbs, egg, cumin and salt and shape 4 patties. Chill for 15 minutes.|Boil the chicory for 6 minutes, squeeze it and sauté with the garlic and a little oil.|Pan-fry the burgers in the remaining oil for 4 minutes a side.|Fill the buns with burger, chicory and pecorino."},
  {id:"r-sgombro",u:"pasta-con-lo-sgombro",t:"Pasta con lo sgombro",c:"primi",k:"Mains",m:25,s:4,r:"Sicilia",a:"mackerel",d:"A quick pantry pasta with mackerel, cherry tomatoes, capers and toasted breadcrumbs.",i:"320 g short pasta|250 g mackerel fillets in oil|200 g cherry tomatoes, halved|1 tbsp capers|1 clove garlic|1 dried chili|40 g toasted breadcrumbs|1 handful parsley",p:"Sauté the garlic, chili and tomatoes in a little of the mackerel oil for 5 minutes.|Add the flaked mackerel and capers.|Toss in the cooked pasta with a splash of its water.|Top with breadcrumbs and parsley."},
  {id:"r-risotto-pomodorini",u:"risotto-con-pomodorini-arrosto-alici-e-stracciatella",t:"Risotto con pomodorini arrosto, alici e stracciatella",c:"primi",k:"Mains",m:45,s:4,a:"risoTom",d:"Creamy risotto topped with sweet roasted tomatoes, salty anchovies and cold stracciatella.",i:"320 g Carnaroli rice|300 g cherry tomatoes|1 shallot, chopped|1 l hot vegetable stock|80 ml dry white wine|30 g butter|6 anchovy fillets|150 g stracciatella|3 tbsp olive oil",p:"Roast the tomatoes with the oil and some salt at 200°C for 25 minutes.|Soften the shallot, toast the rice, add the wine, then add stock a ladle at a time for 17 minutes.|Stir in the butter off the heat.|Serve topped with the tomatoes, anchovies and stracciatella."},
  {id:"r-tagliolini-cavolfiore",u:"tagliolini-al-tartufo-con-crema-di-cavolfiore-e-burrata-affumicata",t:"Tagliolini al tartufo, crema di cavolfiore e burrata affumicata",c:"primi",k:"Mains",m:30,s:4,a:"truffle",d:"Tagliolini in a silky cauliflower cream with truffle butter, crowned with smoked burrata.",i:"300 g fresh tagliolini|400 g cauliflower, in florets|1 shallot|300 ml vegetable stock|20 g truffle butter|1 smoked burrata|Black pepper",p:"Simmer the cauliflower and shallot in the stock until soft, then blend until smooth.|Cook the tagliolini for 2 minutes and toss in the cream with the truffle butter.|Plate it and tear the burrata on top.|Finish with pepper."},
  {id:"r-carrozza",u:"mozzarelle-in-carrozza",t:"Mozzarelle in carrozza",c:"antipasti",k:"Starters",m:20,s:4,r:"Campania",a:"fried",d:"Mozzarella sandwiches dipped in egg and fried until golden, with a molten, stretchy middle.",i:"8 slices white bread|250 g mozzarella, sliced and patted dry|2 eggs|100 ml milk|60 g plain flour|Oil for frying|Salt",p:"Make 4 sandwiches with the mozzarella and press the edges together.|Dip them in flour, then in the eggs beaten with the milk.|Fry in hot oil until golden on both sides.|Drain, salt and eat hot."},
  {id:"r-tenerina",u:"torta-tenerina",t:"Torta tenerina",c:"dolci",k:"Baking",m:45,s:8,r:"Emilia-Romagna",a:"torta",d:"Ferrara's chocolate cake with a thin crisp crust and a soft, almost molten centre.",i:"200 g dark chocolate|100 g butter|150 g sugar|3 eggs, separated|50 g plain flour|Icing sugar, to dust",p:"Heat the oven to 170°C and melt the chocolate with the butter.|Whisk the yolks with the sugar, then stir in the chocolate and flour.|Whip the whites to soft peaks and fold them in.|Bake for 25 minutes so the centre stays soft, then dust with icing sugar."},
  {id:"r-cavolo-nero",u:"spaghetti-al-cavolo-nero-con-burrata",t:"Spaghetti al cavolo nero con burrata",c:"primi",k:"Mains",m:25,s:4,r:"Toscana",a:"kalepasta",d:"Spaghetti in a garlicky blended cavolo nero sauce, topped with creamy burrata.",i:"320 g spaghetti|300 g cavolo nero|1 clove garlic|4 tbsp olive oil|30 g Parmigiano, grated|1 burrata|1 pinch chili flakes",p:"Strip the leaves from the stalks and boil them for 5 minutes.|Blend with the garlic, oil, Parmigiano and some cooking water.|Toss with the cooked spaghetti.|Top with torn burrata and chili."},
  {id:"r-cous-cous",u:"cous-cous-di-verdure-e-frutta-secca-su-letto-di-gazpacho",t:"Cous cous di verdure e frutta secca su gazpacho",c:"antipasti",k:"Salads",m:30,s:4,a:"gazpacho",d:"Vegetable couscous with almonds and raisins, served on a cold, tangy tomato gazpacho.",i:"200 g couscous|1 courgette, diced|1 pepper, diced|40 g almonds|40 g raisins|500 g ripe tomatoes|1/2 cucumber|1 clove garlic|2 tbsp sherry vinegar|5 tbsp olive oil",p:"Pour 250 ml boiling salted water over the couscous, cover for 5 minutes, then fluff it up.|Sauté the courgette and pepper and stir them in with the almonds and raisins.|Blend the tomatoes, cucumber, garlic, vinegar and most of the oil until smooth, then chill.|Pour the gazpacho into bowls and pile the couscous on top."},
  {id:"r-insalatona",u:"insalatona-fresca-e-leggera-con-noci",t:"Insalatona fresca con noci",c:"contorni",k:"Salads",m:15,s:2,a:"insalatona",d:"A big crunchy salad with apple, fennel, greens and walnuts in a lemon and honey dressing.",i:"150 g mixed salad leaves|1 apple|1 fennel bulb|40 g walnuts|50 g goat's cheese|1 lemon|3 tbsp olive oil|1 tsp honey",p:"Slice the apple and fennel thinly.|Toast the walnuts in a dry pan.|Whisk the lemon juice, oil, honey and salt.|Toss with the leaves and top with crumbled cheese and walnuts."},
  {id:"r-tortino",u:"tortino-con-cuore-morbido-al-cioccolato-e-torrone",t:"Tortino al cioccolato con cuore morbido e torrone",c:"dolci",k:"Desserts",m:25,s:4,a:"lavacake",d:"Individual chocolate puddings with a molten heart and chopped nougat. A good use for leftover torrone.",i:"120 g dark chocolate|100 g butter|2 eggs|2 egg yolks|60 g sugar|30 g plain flour|60 g torrone, chopped",p:"Heat the oven to 200°C and butter and cocoa-dust 4 ramekins.|Melt the chocolate and butter. Whisk the eggs, yolks and sugar until thick, combine and fold in the flour.|Half-fill the ramekins, add the torrone and top with the rest of the mix.|Bake for 10 to 11 minutes and turn out straight away."},
  {id:"r-peperoni",u:"linguine-con-peperoni-arrosto-capperi-e-olive",t:"Linguine con peperoni arrosto, capperi e olive",c:"primi",k:"Mains",m:40,s:4,a:"pepperpasta",d:"Linguine with sweet roasted peppers, capers and black olives.",i:"320 g linguine|3 red and yellow peppers|1 tbsp capers|50 g black olives|1 clove garlic|4 tbsp olive oil|1 handful parsley",p:"Roast the peppers at 220°C for 25 minutes, cool them in a covered bowl, then peel and slice.|Warm the garlic in the oil and add the peppers, capers and olives.|Toss with the linguine and a little pasta water.|Finish with parsley."},
  {id:"r-risotto-arancia",u:"risotto-al-burro-con-arancia-parmigiano-e-bottarga-deluxe",t:"Risotto al burro con arancia, Parmigiano e bottarga",c:"primi",k:"Mains",m:30,s:4,r:"Sardegna",a:"risoOrangeB",d:"A buttery white risotto lifted with orange zest and finished with grated bottarga.",i:"320 g Carnaroli rice|1 shallot, chopped|1 l hot stock|80 ml dry white wine|60 g butter|50 g Parmigiano, grated|1 orange|20 g bottarga",p:"Soften the shallot in a little of the butter, toast the rice and add the wine.|Cook with the stock, a ladle at a time, for 17 minutes.|Off the heat, beat in the rest of the butter, the Parmigiano, the orange zest and a splash of juice.|Grate bottarga over to serve."},
  {id:"r-patate-dolci",u:"patate-dolci-croccanti-con-maionese-alla-paprika-e-salsa-allo-yogurt-greco",t:"Patate dolci croccanti con due salse",c:"contorni",k:"Sides",m:40,s:4,a:"sweetpot",d:"Oven-crisp sweet potato wedges with two dips: smoky paprika mayonnaise and herby Greek yogurt.",i:"800 g sweet potatoes|2 tbsp cornflour|3 tbsp olive oil|100 g mayonnaise|1 tsp smoked paprika|150 g Greek yogurt|1 tbsp chopped chives|1/2 lemon",p:"Cut the potatoes into wedges and toss with the cornflour, oil and salt.|Roast at 220°C for 30 minutes, turning once.|Stir the paprika into the mayonnaise, and mix the yogurt with chives, lemon juice and salt.|Serve the wedges hot with both dips."},
  {id:"r-gnocchi-ricotta",u:"gnocchi-di-ricotta-in-crema-di-zucchine-stracciatella-e-alici",t:"Gnocchi di ricotta in crema di zucchine, stracciatella e alici",c:"primi",k:"Mains",m:40,s:4,a:"ricottagnocchi",d:"Light ricotta gnocchi in a courgette cream, topped with stracciatella and anchovies.",i:"400 g ricotta, drained|1 egg yolk|50 g Parmigiano, grated|150 g plain flour|3 courgettes, sliced|1 shallot|150 g stracciatella|6 anchovy fillets|3 tbsp olive oil",p:"Mix the ricotta, yolk, Parmigiano and flour into a soft dough, roll into ropes and cut into gnocchi.|Cook the courgettes and shallot in the oil until soft, then blend with a little water.|Boil the gnocchi until they float and toss them in the cream.|Top with stracciatella and anchovies."},
  {id:"r-polpettine-verde",t:"Polpettine di manzo in salsa verde",c:"secondi",k:"Mains",m:40,s:4,r:"Piemonte",a:"greenmeatballs",d:"Small beef meatballs with a sharp green sauce of parsley, capers and anchovy.",i:"500 g minced beef|1 egg|40 g Parmigiano, grated|50 g breadcrumbs|1 large handful parsley|1 tbsp capers|2 anchovy fillets|1 tbsp white wine vinegar|6 tbsp olive oil",p:"Mix the beef, egg, Parmigiano, breadcrumbs and salt and roll into small balls.|Brown them in a pan with a little oil for 8 to 10 minutes.|Blend the parsley, capers, anchovies, vinegar and remaining oil.|Spoon the sauce over the meatballs."},
  {id:"r-orata-maionese",t:"Filetti di orata con maionese alle acciughe e peperoncino",c:"secondi",k:"Mains",m:25,s:4,a:"fish",d:"Crisp-skinned sea bream fillets with a punchy anchovy and chili mayonnaise.",i:"4 sea bream fillets|2 tbsp olive oil|100 g mayonnaise|3 anchovy fillets, mashed|1 small fresh chili, minced|1/2 lemon|Salt",p:"Score the skin and dry the fillets well.|Fry skin side down in hot oil for 4 minutes, then flip for 1 minute.|Mix the mayonnaise with the anchovies, chili and lemon juice.|Serve the fish with the sauce."},
  {id:"r-risotto-hokkaido",t:"Risotto alla crema di zucca Hokkaido e porri",c:"primi",k:"Mains",m:45,s:4,a:"pumpkin",d:"Risotto with a velvety Hokkaido pumpkin cream and gently sweated leeks.",i:"320 g Carnaroli rice|400 g Hokkaido pumpkin, diced|1 leek, sliced|1 l hot stock|80 ml dry white wine|40 g butter|50 g Parmigiano, grated",p:"Cook the pumpkin in a little of the stock until soft and blend to a cream.|Sweat the leek in half the butter, toast the rice and add the wine.|Add stock gradually for 15 minutes, then stir in the pumpkin cream.|Finish with the rest of the butter and the Parmigiano off the heat."}
];
HOUSE.push(...RUBEN.map(e => ({id:e.id, title:e.t, course:e.c, category:e.k, time:e.m, serves:e.s, region:e.r || "", cuisine:"italian",
  summary:e.d, ingredients:e.i.split("|"), steps:e.p.split("|"), art:RP[e.a] || AP[e.a], house:true})));

/* Ramen (Japanese kitchen). g = greens/sesame sprinkle colours; diet shown on cards */
const GR = ["#4f9a45","#7fb069","#f4f1e8"];
const RAMEN = [
  {id:"j-shio",t:"Shio ramen",r:"Hakodate",m:60,s:2,a:{kind:"ramen",base:"#f1e3b8",chashu:1,egg:1,nori:1,dots:GR},d:"A clear, golden chicken and kombu broth seasoned simply with salt. The lightest and oldest style of ramen.",i:"1.2 l chicken stock|10 g kombu|1 tbsp sake|1 tsp salt|2 tsp light soy sauce|2 tbsp chicken fat or neutral oil|2 portions fresh ramen noodles|4 slices chashu or poached chicken|1 soft-boiled egg, halved|2 spring onions, sliced|2 sheets nori",p:"Warm the stock with the kombu for 20 minutes without letting it boil, then lift out the kombu.|Make the tare: stir the salt, soy sauce and sake into a little hot broth and divide it between two bowls with the fat.|Cook the noodles as the pack says, usually 1 to 2 minutes, and drain them well.|Pour the hot broth into the bowls, add the noodles and top with chashu, egg, spring onion and nori."},
  {id:"j-shoyu",t:"Shoyu ramen",r:"Tokyo",m:60,s:2,a:{kind:"ramen",base:"#8a5a2b",chashu:1,egg:1,nori:1,dots:GR},d:"Tokyo-style ramen in a clear chicken and dashi broth seasoned with a savoury soy tare.",i:"1 l chicken stock|300 ml dashi|4 tbsp soy sauce|1 tbsp mirin|1 tbsp sake|1 tbsp neutral oil|2 portions fresh ramen noodles|4 slices chashu|1 marinated egg, halved|60 g menma (bamboo shoots)|2 spring onions, sliced|2 sheets nori",p:"Heat the stock and dashi together.|Simmer the soy sauce, mirin and sake for 1 minute to make the tare, then divide it and the oil between two bowls.|Cook the noodles and drain them well.|Add the hot broth, then the noodles, and top with chashu, egg, menma, spring onion and nori."},
  {id:"j-miso",t:"Miso ramen",r:"Sapporo",m:40,s:2,a:{kind:"ramen",base:"#c98a3a",mince:1,corn:1,egg:1,dots:GR},d:"Sapporo's rich, nutty miso ramen with stir-fried pork and vegetables, sweet corn and a pat of butter.",i:"1 l chicken stock|3 tbsp white or red miso|1 tbsp sesame paste|1 clove garlic, grated|1 tsp grated ginger|150 g minced pork|150 g bean sprouts|1/4 cabbage, shredded|1 tbsp neutral oil|2 portions fresh ramen noodles|80 g sweetcorn|20 g butter|2 spring onions, sliced",p:"Stir-fry the pork with the garlic and ginger in the oil, then add the bean sprouts and cabbage for 2 minutes.|Pour in the stock and bring to a simmer.|Whisk the miso and sesame paste with a ladle of broth and stir it back in. Don't let it boil again.|Cook the noodles, divide between bowls and ladle over the broth and vegetables. Top with corn, butter and spring onion."},
  {id:"j-tonkotsu",t:"Tonkotsu ramen",r:"Fukuoka",m:720,s:4,a:{kind:"ramen",base:"#f4ead2",chashu:1,egg:1,nori:1,dots:["#4f9a45","#e8a0a0","#2b2b2b"]},d:"Hakata's creamy pork bone broth, boiled hard for hours until it turns milky white. A weekend project.",i:"2 kg pork trotters and neck bones|1 onion|1 head garlic, halved|1 thumb ginger|4 tbsp soy sauce|1 tbsp salt|4 portions thin ramen noodles|8 slices chashu|2 marinated eggs, halved|4 spring onions, sliced|Pickled ginger and sesame, to serve",p:"Cover the bones with water, boil for 10 minutes, then drain and scrub off the scum.|Return them to the pot with fresh water, the onion, garlic and ginger and keep at a hard rolling boil for 10 to 12 hours, topping up with water, until the broth is milky.|Strain and season with the soy sauce and salt.|Cook the thin noodles for 1 minute, add them to bowls with the broth and top with chashu, egg, spring onion, pickled ginger and sesame."},
  {id:"j-mayu",t:"Black garlic ramen",r:"Kumamoto",m:60,s:2,a:{kind:"ramen",base:"#efe2c8",mayu:1,chashu:1,egg:1,dots:["#4f9a45","#3a2a1a"]},d:"Creamy pork broth swirled with mayu, a bittersweet black garlic oil made by slowly burning garlic in sesame oil. Start with tonkotsu broth made ahead.",i:"1 l tonkotsu or rich pork broth|8 cloves garlic, finely chopped|60 ml neutral oil|2 tbsp sesame oil|2 tbsp soy sauce|2 portions thin ramen noodles|4 slices chashu|1 marinated egg, halved|40 g wood ear mushrooms, sliced|2 spring onions, sliced",p:"Cook the garlic in the neutral oil over medium-low heat, stirring, until it turns completely black, about 15 minutes.|Cool slightly, add the sesame oil and blend into a smooth black oil. This is the mayu.|Heat the broth with the soy sauce.|Cook the noodles, add them to bowls with the broth, drizzle with mayu and top with chashu, egg, mushrooms and spring onion."},
  {id:"j-veg-miso",diet:"Vegetarian",t:"Miso butter corn ramen",r:"Hokkaido",m:35,s:2,a:{kind:"ramen",base:"#d9a04f",corn:1,egg:1,greensBig:1,dots:GR},d:"A vegetarian take on Hokkaido miso ramen with a kombu and shiitake broth, sweet corn, butter and a soft egg.",i:"1.2 l water|10 g kombu|6 dried shiitake|3 tbsp white miso|1 tbsp soy sauce|1 tsp grated ginger|2 portions fresh ramen noodles|120 g sweetcorn|20 g butter|1 soft-boiled egg, halved|100 g bean sprouts|2 spring onions, sliced",p:"Soak the kombu and shiitake in the water for 30 minutes, then bring almost to a boil and lift out the kombu.|Simmer for 10 minutes, slice the shiitake and return them to the pot.|Off the boil, whisk in the miso, soy sauce and ginger.|Cook the noodles, add the broth and top with corn, butter, egg, bean sprouts and spring onion."},
  {id:"j-vegan-shoyu",diet:"Vegan",t:"Vegan shoyu ramen with crispy tofu",r:"",m:40,s:2,a:{kind:"ramen",base:"#7a4a24",tofu:1,greensBig:1,nori:1,dots:GR},d:"A deep, savoury shiitake and kombu shoyu broth with crispy tofu, bok choy and egg-free noodles.",i:"1.2 l water|10 g kombu|8 dried shiitake|4 tbsp soy sauce|1 tbsp mirin|1 tbsp toasted sesame oil|200 g firm tofu, cubed|1 tbsp cornflour|2 tbsp neutral oil|2 baby bok choy, halved|2 portions egg-free ramen noodles|2 spring onions, sliced|2 sheets nori",p:"Soak the kombu and shiitake for 30 minutes, then simmer gently for 15 minutes and strain. Slice the mushrooms.|Season the broth with the soy sauce, mirin and sesame oil.|Toss the tofu in cornflour and fry until crisp, and blanch the bok choy for 1 minute.|Cook the noodles, add the broth and top with tofu, bok choy, shiitake, spring onion and nori."},
  {id:"j-vegan-tantan",diet:"Vegan",t:"Vegan tantanmen",r:"",m:35,s:2,a:{kind:"ramen",base:"#d9702a",mince:1,chili:1,greensBig:1,dots:GR},d:"A creamy sesame and soy milk broth with chili oil and savoury soy mince. Rich, spicy and fully plant-based.",i:"600 ml unsweetened soy milk|400 ml vegetable stock|3 tbsp tahini or Chinese sesame paste|2 tbsp soy sauce|1 tbsp white miso|2 tbsp chili oil|150 g dried soy mince, rehydrated|1 clove garlic, minced|1 tsp grated ginger|1 tbsp neutral oil|2 portions egg-free ramen noodles|2 baby bok choy|2 spring onions, sliced",p:"Fry the soy mince with the garlic and ginger in the oil until browned, then season with 1 tbsp of the soy sauce.|Whisk the tahini, miso and remaining soy sauce in each bowl.|Heat the soy milk and stock gently, without boiling, and pour into the bowls, stirring.|Add the noodles and bok choy, and top with soy mince, spring onion and chili oil."},
  {id:"j-tantanmen",t:"Tantanmen",r:"",m:30,s:2,a:{kind:"ramen",base:"#c9602a",mince:1,chili:1,greensBig:1,dots:GR},d:"Japan's version of Sichuan dan dan noodles: spicy minced pork over noodles in a sesame-rich broth.",i:"800 ml chicken stock|3 tbsp Chinese sesame paste|2 tbsp soy sauce|1 tbsp rice vinegar|2 tbsp chili oil|200 g minced pork|1 tbsp doubanjiang|1 clove garlic, minced|1 tsp grated ginger|1 tbsp neutral oil|2 portions fresh ramen noodles|2 baby bok choy|2 spring onions, sliced",p:"Fry the pork with the garlic, ginger and doubanjiang in the oil until crisp.|Mix the sesame paste, soy sauce and vinegar in each bowl.|Pour in the hot stock and stir until smooth.|Add the cooked noodles and bok choy, and top with pork, spring onion and chili oil."},
  {id:"j-tsukemen",t:"Tsukemen",r:"Tokyo",m:40,s:2,a:{kind:"ramen",base:"#6b3a1e",noodle:"#f0d27a",chashu:1,egg:1,nori:1,dots:GR},d:"Dipping ramen: thick, chilled noodles served beside a hot, concentrated pork and fish dipping broth.",i:"500 ml rich pork or chicken stock|4 tbsp soy sauce|1 tbsp mirin|1 tbsp rice vinegar|1 tsp sugar|10 g katsuobushi|2 portions thick ramen noodles|4 slices chashu|1 marinated egg, halved|2 spring onions, sliced|2 sheets nori",p:"Simmer the stock, soy sauce, mirin, vinegar, sugar and katsuobushi for 10 minutes, then strain. It should taste strong and slightly sour.|Cook the thick noodles as the pack says, then rinse under cold water to firm them up.|Pile the noodles on plates with chashu, egg and nori.|Serve the hot broth in bowls with spring onion, and dip the noodles as you eat."},
  {id:"j-hiyashi",t:"Hiyashi chuka",k:"Mains",r:"",m:25,s:2,a:{kind:"ramen",base:"#f4ead2",strips:1,dots:["#f4f1e8","#2b2b2b"]},d:"Cold ramen salad for hot days: chilled noodles under colourful strips of ham, cucumber, egg and tomato, with a tangy soy dressing.",i:"2 portions fresh ramen noodles|3 tbsp soy sauce|3 tbsp rice vinegar|1 tbsp sugar|1 tbsp sesame oil|2 eggs|1 cucumber, in matchsticks|4 slices ham, in strips|1 tomato, in wedges|1 tbsp toasted sesame seeds|Japanese mustard, to serve",p:"Whisk the soy sauce, vinegar, sugar and sesame oil with 2 tbsp water and chill.|Beat the eggs and cook them as thin omelettes, then roll up and slice into ribbons.|Cook the noodles, rinse them in iced water and drain well.|Arrange the toppings over the noodles, pour over the dressing and finish with sesame and mustard."},
  {id:"j-mazesoba",t:"Mazesoba",k:"Mains",r:"Nagoya",m:25,s:2,a:{kind:"ramen",base:"#b8783a",mince:1,yolk:1,nori:1,chili:1,dots:["#4f9a45","#7fb069"]},d:"Brothless ramen from Nagoya: thick noodles tossed at the table with spicy minced pork, garlic chives, nori and a raw egg yolk.",i:"2 portions thick ramen noodles|200 g minced pork|1 tbsp doubanjiang|2 cloves garlic, minced|2 tbsp soy sauce|1 tbsp sesame oil|1 tbsp chili oil|2 egg yolks|1 handful garlic chives, chopped|2 sheets nori, shredded|1 tbsp katsuobushi flakes",p:"Fry the pork with the garlic and doubanjiang until crisp, then add 1 tbsp of the soy sauce.|Mix the remaining soy sauce, the sesame oil and chili oil in each bowl.|Cook the noodles, drain them and toss in the sauce.|Top with pork, chives, nori, katsuobushi and an egg yolk, and mix everything well before eating."}
];

/* Mexican and Indian kitchens: traditional dishes plus modern twists (tw) */
const MXIN = [
  // Mexican
  {id:"m-pastor",q:"mexican",t:"Tacos al pastor",k:"Mains",m:60,s:4,r:"Mexico City",a:{kind:"tacos",dots:["#d9702a","#f2c94c","#4f9a45","#f4f1e8"]},d:"Pork marinated in chilies, achiote and pineapple, seared until charred and piled into corn tortillas. Marinate for 2 hours first.",i:"800 g pork shoulder, thinly sliced|3 dried guajillo chilies|2 tbsp achiote paste|3 tbsp pineapple juice|2 tbsp white vinegar|2 cloves garlic|1 tsp ground cumin|1 tsp dried oregano|12 small corn tortillas|200 g fresh pineapple, diced|1 white onion, finely chopped|1 handful coriander|2 limes",p:"Toast and soak the chilies, then blend them with the achiote, pineapple juice, vinegar, garlic, cumin, oregano and salt.|Coat the pork and marinate for at least 2 hours.|Sear the pork in batches in a very hot pan until charred at the edges, then chop it.|Sear the pineapple too, warm the tortillas, and fill with pork, pineapple, onion, coriander and a squeeze of lime."},
  {id:"m-guacamole",q:"mexican",diet:"Vegan",t:"Guacamole con totopos",k:"Starters",m:15,s:4,r:"Michoacán",a:{kind:"soup",v:"bowl",base:"#8fbf4a",dots:["#d9412b","#f4f1e8","#3f7a2c"]},d:"Chunky avocado mashed with lime, chili, onion and coriander, served with crisp tortilla chips.",i:"3 ripe avocados|1 lime|1/2 white onion, finely chopped|1 serrano chili, finely chopped|1 tomato, diced|1 handful coriander, chopped|Salt|Tortilla chips, to serve",p:"Mash the onion, chili and a pinch of salt into a rough paste.|Add the avocado and mash with a fork, leaving it chunky.|Fold in the tomato, coriander and lime juice.|Taste for salt and serve straight away with chips."},
  {id:"m-pozole",q:"mexican",t:"Pozole rojo",k:"Soups",m:150,s:6,r:"Jalisco",a:{kind:"soup",v:"bowl",base:"#b8432c",dots:["#f4f1e8","#7fb069","#f2d58a"],leaf:"#7fb069"},d:"A deep red pork and hominy soup, served with crunchy toppings so everyone builds their own bowl.",i:"1 kg pork shoulder, in chunks|800 g cooked hominy|4 dried guajillo chilies|2 dried ancho chilies|1 onion|4 cloves garlic|1 tsp dried oregano|Shredded cabbage, sliced radish, lime and tostadas, to serve",p:"Simmer the pork with half the onion, 2 garlic cloves and salt in 3 l water for 1½ hours.|Soak the toasted chilies, then blend them with the rest of the onion and garlic and a cup of broth. Strain into the pot.|Add the hominy and oregano and simmer for 30 minutes more.|Serve with cabbage, radish, lime and tostadas on the side."},
  {id:"m-enchiladas",q:"mexican",t:"Enchiladas verdes",k:"Mains",m:45,s:4,r:"",a:{kind:"soup",v:"plate",base:"#6fa040",dots:["#f4f1e8","#e9d9a6","#d9412b"]},d:"Corn tortillas rolled around shredded chicken and baked under a tangy tomatillo salsa with cream and cheese.",i:"500 g tomatillos|2 green chilies|1/2 onion|2 cloves garlic|1 handful coriander|400 g cooked chicken, shredded|12 corn tortillas|150 g crème fraîche|120 g queso fresco or feta, crumbled|2 tbsp oil",p:"Boil the tomatillos, chilies, onion and garlic for 8 minutes, then blend with the coriander and salt.|Fry the salsa in the oil for 5 minutes until it darkens slightly.|Warm the tortillas, fill with chicken, roll them up and lay them in a dish.|Cover with salsa, cream and cheese and bake at 200°C for 15 minutes."},
  {id:"m-cochinita",q:"mexican",t:"Cochinita pibil",k:"Mains",m:240,s:6,r:"Yucatán",a:{kind:"chunks",v:"plate",dots:["#d9702a","#c2592a","#e86a8a"],leaf:"#4f9a45"},d:"Yucatán's slow-roasted pork in achiote and citrus, wrapped in banana leaves and served with pink pickled onions.",i:"1.5 kg pork shoulder|100 g achiote paste|200 ml orange juice|60 ml lime juice|4 cloves garlic|1 tsp ground cumin|Banana leaves or baking paper|2 red onions, thinly sliced|150 ml white vinegar|1 habanero, sliced|Corn tortillas, to serve",p:"Blend the achiote with the citrus juices, garlic, cumin and salt and rub it all over the pork. Marinate overnight if you can.|Wrap in banana leaves, cover tightly and roast at 160°C for 3½ hours, until it falls apart.|Meanwhile pour hot salted vinegar over the onions and habanero and leave them to turn pink.|Shred the pork in its juices and serve in tortillas with the onions."},
  {id:"m-chilaquiles",q:"mexican",t:"Chilaquiles rojos",k:"Breakfast",m:25,s:2,r:"Mexico City",a:{kind:"soup",v:"plate",base:"#c2412d",dots:["#f2d58a","#f4f1e8","#3f8f3a"]},d:"Crisp tortilla chips simmered briefly in red salsa and topped with a fried egg, cream and cheese. Mexico's favourite breakfast.",i:"150 g tortilla chips|400 g tomatoes|1 dried guajillo chili, soaked|1 clove garlic|1/4 onion|2 eggs|2 tbsp crème fraîche|40 g queso fresco or feta|1 tbsp oil|Sliced onion and coriander, to serve",p:"Blend the tomatoes with the chili, garlic and onion, then simmer in the oil for 8 minutes.|Fry the eggs.|Toss the chips in the hot salsa for 1 minute, so they soften at the edges but keep some crunch.|Plate with the eggs, cream, cheese, onion and coriander."},
  {id:"m-churros",q:"mexican",diet:"Vegetarian",t:"Churros con chocolate",k:"Desserts",m:40,s:4,r:"",a:{kind:"chunks",v:"plate",dots:["#d9a04f","#c98a3a","#5a3420"]},d:"Crisp ridged dough sticks rolled in cinnamon sugar, for dipping into thick hot chocolate.",i:"250 ml water|30 g butter|1 tbsp sugar|150 g plain flour|1 egg|Oil for frying|100 g sugar, for rolling|1 tsp cinnamon|150 g dark chocolate|300 ml milk|1 tsp cornflour",p:"Bring the water, butter, sugar and a pinch of salt to the boil, beat in the flour, then beat in the egg.|Pipe through a star nozzle into oil at 180°C and fry until golden.|Roll the hot churros in cinnamon sugar.|Heat the milk with the chocolate and cornflour, whisking until thick, and serve for dipping."},
  {id:"m-birria-ramen",q:"mexican",tw:1,t:"Birria ramen",k:"Soups",m:200,s:4,r:"Jalisco",a:{kind:"ramen",base:"#a8361e",mince:1,chili:1,dots:["#f4f1e8","#4f9a45"]},d:"Slow-braised birria beef in a chili and spice broth, served over ramen noodles with onion, coriander and lime.",i:"1 kg beef shin or chuck|4 dried guajillo chilies|2 dried ancho chilies|1 onion|4 cloves garlic|2 tomatoes|1 cinnamon stick|1 tsp ground cumin|3 cloves|1 tbsp vinegar|4 portions ramen noodles|Chopped onion, coriander and lime, to serve",p:"Toast and soak the chilies, then blend them with the onion, garlic, tomatoes, spices and vinegar.|Brown the beef, pour over the sauce and 1.5 l water, cover and simmer for 3 hours until tender.|Shred the beef and skim some of the red fat to drizzle on top.|Cook the noodles, add the broth and beef, and finish with onion, coriander and lime."},
  {id:"m-cauli-tacos",q:"mexican",tw:1,diet:"Vegan",t:"Cauliflower tacos with chipotle crema",k:"Mains",m:40,s:4,r:"",a:{kind:"tacos",dots:["#f2e6c8","#e98a2a","#7fb069","#a23b72"]},d:"Spiced roasted cauliflower in warm tortillas with a smoky cashew and chipotle crema and quick pickled cabbage.",i:"1 cauliflower, in small florets|2 tbsp oil|1 tsp smoked paprika|1 tsp ground cumin|80 g cashews, soaked|1 chipotle in adobo|1 lime|200 g red cabbage, shredded|2 tbsp vinegar|8 corn tortillas|1 handful coriander",p:"Toss the cauliflower with the oil, spices and salt and roast at 220°C for 25 minutes.|Blend the cashews with the chipotle, half the lime juice, salt and a splash of water until smooth.|Toss the cabbage with the vinegar and salt.|Fill warm tortillas with cauliflower, cabbage, crema and coriander."},
  {id:"m-esquites",q:"mexican",tw:1,diet:"Vegetarian",t:"Esquites bowl with feta and lime",k:"Salads",m:20,s:4,r:"",a:{kind:"salad",dots:["#f5cf3a","#f2d58a","#f4f1e8","#d9412b","#4f9a45"]},d:"Street-cart esquites turned into a fresh salad bowl: charred corn, lime, chili, herbs, avocado and crumbled feta.",i:"600 g sweetcorn kernels|1 tbsp butter|2 tbsp mayonnaise|1 lime|1 tsp chili powder|1 avocado, diced|80 g feta, crumbled|1 handful coriander|1/2 red onion, finely chopped",p:"Char the corn in a dry, very hot pan for 6 to 8 minutes, then stir in the butter.|Mix the mayonnaise with the lime juice, chili and salt.|Toss the warm corn with the dressing, onion and coriander.|Top with avocado and feta and dust with more chili."},
  // Indian
  {id:"n-butter-chicken",q:"indian",t:"Butter chicken",k:"Mains",m:60,s:4,r:"Delhi",a:{kind:"chunks",v:"bowl",base:"#e07b39",dots:["#f2c49a","#e8a070"],leaf:"#4f9a45"},d:"Tandoori-style chicken in a silky tomato, butter and cream sauce scented with fenugreek. Delhi's most famous export.",i:"700 g chicken thighs, in pieces|150 g yogurt|2 tsp garam masala|1 tsp chili powder|2 cloves garlic, grated|1 tsp grated ginger|40 g butter|400 g tomato passata|100 ml cream|1 tsp dried fenugreek leaves|1 tsp sugar",p:"Marinate the chicken in the yogurt, half the garam masala, the chili, garlic, ginger and salt for 30 minutes.|Grill or pan-sear the chicken until charred in places.|Melt the butter, simmer the passata with the rest of the garam masala for 10 minutes, then stir in the cream, sugar and crushed fenugreek.|Add the chicken and simmer for 5 minutes. Serve with rice or naan."},
  {id:"n-dal",q:"indian",diet:"Vegetarian",t:"Dal tadka",k:"Soups",m:40,s:4,r:"Punjab",a:{kind:"soup",v:"bowl",base:"#e9b23a",dots:["#8a3b22","#4f9a45","#f6e7b0"]},d:"Yellow lentils cooked soft and finished with a sizzling tempering of ghee, cumin, garlic and chili.",i:"250 g yellow lentils (toor or moong dal)|1 tsp turmeric|1 tomato, chopped|2 tbsp ghee|1 tsp cumin seeds|3 cloves garlic, sliced|2 dried red chilies|1 pinch asafoetida|1 handful coriander",p:"Rinse the lentils and simmer them with the turmeric, tomato and 1 l water for 25 minutes until soft. Season.|Heat the ghee until shimmering and add the cumin, garlic, chilies and asafoetida.|When the garlic turns golden, pour the sizzling tadka over the dal.|Finish with coriander and serve with rice."},
  {id:"n-chana",q:"indian",diet:"Vegan",t:"Chana masala",k:"Mains",m:40,s:4,r:"Punjab",a:{kind:"chunks",v:"bowl",base:"#b8562e",dots:["#e9cf8a","#d9b26f"],leaf:"#4f9a45"},d:"Chickpeas simmered in a tangy, spiced onion and tomato gravy. Hearty, cheap and naturally vegan.",i:"800 g cooked chickpeas|2 tbsp oil|1 tsp cumin seeds|2 onions, finely chopped|2 cloves garlic|1 tbsp grated ginger|1 green chili|3 tomatoes, chopped|2 tsp chana masala or garam masala|1 tsp amchur (dried mango powder)|1 handful coriander",p:"Fry the cumin seeds in the oil, then the onions until deep golden, about 12 minutes.|Add the garlic, ginger and chili, then the tomatoes and spices, and cook until the oil separates.|Add the chickpeas and a cup of water and simmer for 15 minutes, mashing a few to thicken.|Finish with amchur and coriander."},
  {id:"n-palak",q:"indian",diet:"Vegetarian",t:"Palak paneer",k:"Mains",m:35,s:4,r:"Punjab",a:{kind:"chunks",v:"bowl",base:"#3d6b22",dots:["#f4f1e8","#efe7d8"]},d:"Cubes of soft paneer in a smooth, garlicky spinach sauce.",i:"500 g spinach|250 g paneer, cubed|2 tbsp ghee|1 onion, chopped|2 cloves garlic|1 tsp grated ginger|1 green chili|1 tsp cumin seeds|1 tsp garam masala|3 tbsp cream",p:"Blanch the spinach for 1 minute, cool it in iced water and blend until smooth.|Fry the paneer in a little ghee until golden and set aside.|Cook the cumin, onion, garlic, ginger and chili in the rest of the ghee until soft, then add the spinach and garam masala.|Simmer for 5 minutes, stir in the cream and paneer and serve."},
  {id:"n-biryani",q:"indian",t:"Hyderabadi chicken biryani",k:"Mains",m:90,s:6,r:"Hyderabad",a:{kind:"rice",v:"plate",base:"#d9822a",dots:["#8a5a2b","#f2c94c","#4f9a45"],leaf:"#4f9a45"},d:"Layers of spiced chicken and saffron basmati rice, sealed and slow-steamed so the flavours meet.",i:"800 g chicken thighs|200 g yogurt|2 tsp biryani masala|1 tsp chili powder|1 tbsp ginger-garlic paste|400 g basmati rice|2 onions, thinly sliced and fried crisp|1 pinch saffron in 3 tbsp warm milk|3 tbsp ghee|1 handful mint|1 handful coriander|4 cardamom pods, 4 cloves and 1 bay leaf",p:"Marinate the chicken in the yogurt, masala, chili, ginger-garlic paste, half the fried onions and salt for 1 hour.|Boil the rice with the whole spices until about 70% cooked, then drain.|Spread the chicken in a heavy pot and cover with the rice, herbs, remaining onions, saffron milk and ghee.|Seal with a lid and foil and cook on very low heat for 40 minutes. Rest for 10 minutes before opening."},
  {id:"n-aloo-gobi",q:"indian",diet:"Vegan",t:"Aloo gobi",k:"Sides",m:35,s:4,r:"Punjab",a:{kind:"chunks",v:"plate",dots:["#f2c94c","#f6e7b0","#e9b23a"],leaf:"#4f9a45"},d:"Potatoes and cauliflower stir-fried with turmeric, cumin and ginger until tender and golden.",i:"1 cauliflower, in florets|3 potatoes, cubed|3 tbsp oil|1 tsp cumin seeds|1 onion, chopped|1 tbsp grated ginger|1 green chili|1 tsp turmeric|1 tsp ground coriander|1 tsp garam masala|1 handful coriander",p:"Fry the cumin seeds in the oil, then the onion until soft.|Add the ginger, chili and ground spices for 1 minute.|Add the potatoes and cauliflower with salt and a splash of water, cover and cook on low for 20 minutes, stirring now and then.|Uncover to crisp the edges, then finish with garam masala and coriander."},
  {id:"n-moilee",q:"indian",t:"Kerala fish curry (meen moilee)",k:"Mains",m:35,s:4,r:"Kerala",a:{kind:"chunks",v:"bowl",base:"#f2d58a",dots:["#f4ead2","#e9d9b0"],leaf:"#4f9a45"},d:"White fish poached in a mild, fragrant coconut sauce with curry leaves, ginger and turmeric.",i:"600 g firm white fish, in pieces|1 tsp turmeric|2 tbsp coconut oil|1 tsp mustard seeds|10 curry leaves|1 onion, sliced|1 tbsp grated ginger|2 green chilies, slit|400 ml coconut milk|1 lime|1 tomato, sliced",p:"Rub the fish with the turmeric and salt.|Pop the mustard seeds in the oil, then add the curry leaves, onion, ginger and chilies and cook until soft.|Pour in the coconut milk and bring to a gentle simmer.|Add the fish and tomato and poach for 6 to 8 minutes. Finish with lime juice."},
  {id:"n-tikka-tacos",q:"indian",tw:1,diet:"Vegetarian",t:"Paneer tikka tacos with mint chutney",k:"Mains",m:40,s:4,r:"",a:{kind:"tacos",dots:["#e07b39","#f4f1e8","#4f9a45","#a23b72"]},d:"A street-food mash-up: charred paneer tikka in soft tortillas or mini naan with mint chutney and pickled onions.",i:"400 g paneer, in cubes|150 g yogurt|2 tsp tikka masala|1 tsp chili powder|1 red pepper, in chunks|1 red onion, thinly sliced|2 tbsp lime juice|1 large handful mint|1 handful coriander|1 green chili|8 small tortillas or mini naan",p:"Marinate the paneer and pepper in 100 g of the yogurt with the tikka masala, chili and salt for 20 minutes.|Toss the onion with the lime juice and salt.|Blend the mint, coriander, chili, remaining yogurt and salt into a chutney.|Grill the paneer and pepper until charred, then fill the tortillas and top with onion and chutney."},
  {id:"n-masala-mac",q:"indian",tw:1,diet:"Vegetarian",t:"Masala mac and cheese",k:"Mains",m:35,s:4,r:"",a:{kind:"pasta",short:true,base:"#f2b632",dots:["#e07b39","#4f9a45"]},d:"Comfort food with a kick: macaroni in a cheddar sauce spiced with turmeric and green chili, finished with a buttery cumin tempering.",i:"320 g macaroni|30 g butter|30 g plain flour|600 ml milk|200 g mature cheddar, grated|1 tsp turmeric|1 tsp garam masala|1 green chili, chopped|1 tsp cumin seeds|1 tbsp ghee|1 handful coriander",p:"Cook the macaroni until just al dente.|Melt the butter, stir in the flour, then whisk in the milk until thick. Add the turmeric, garam masala, chili and cheese.|Mix in the pasta.|Sizzle the cumin seeds in the ghee, pour over the top and finish with coriander."},
  {id:"n-lassi-pannacotta",q:"indian",tw:1,diet:"Vegetarian",t:"Mango lassi panna cotta",k:"Desserts",m:140,s:6,r:"",a:{kind:"glass",base:"#f6e7b0",top:"#f5a623"},d:"The flavours of a mango lassi set into a wobbly dessert with cardamom and pistachio, made with agar so it's vegetarian. Needs 2 hours to set.",i:"400 g mango purée|250 g yogurt|200 ml cream|80 g sugar|1/2 tsp ground cardamom|2 g agar agar powder|30 g pistachios, chopped",p:"Whisk the agar agar into the cream with the sugar and cardamom while it's still cold.|Bring it to the boil, stirring, and let it bubble gently for 1 minute so the agar activates, then take it off the heat.|Quickly whisk in the mango and yogurt, pour into glasses and chill for at least 2 hours, until set.|Top with pistachios before serving."}
];
HOUSE.push(...MXIN.map(e => ({id:e.id, title:e.t, course:"", category:e.k, time:e.m, serves:e.s, region:e.r || "", cuisine:e.q,

for (let i = HOUSE.length - 1; i >= 0; i--) if (HOUSE[i].cuisine === "thai") HOUSE.splice(i, 1);
const MIDEAST = [
  {id:"me-arayes",t:"Arayes",k:"Mains",m:35,s:4,r:"Palestine",a:{kind:"chunks",v:"plate",dots:["#d9a04f","#c98a3a","#8a3b22"],leaf:"#4f9a45"},d:"Pita pockets filled with a thin layer of spiced minced meat, then grilled until the bread is crisp and the filling juicy. A Palestinian street-food favourite.",i:"500 g minced lamb or beef, or a mix|1 onion, grated and squeezed dry|1 handful parsley, finely chopped|1 tsp seven spice (baharat)|1/2 tsp ground cumin|1/2 tsp chili flakes|1 tsp salt|4 pita breads|2 tbsp olive oil|Tahini sauce or yogurt, to serve",p:"Mix the meat with the onion, parsley, spices and salt until sticky.|Cut each pita in half, open the pockets and spread a thin, even layer of meat inside, right to the edges.|Brush the outsides with oil.|Cook in a hot griddle pan or at 220°C in the oven for 12 to 15 minutes, turning once, until crisp and cooked through. Cut into wedges and serve with tahini sauce or yogurt."},
  {id:"me-maqluba",t:"Maqluba",k:"Mains",m:90,s:6,r:"Palestine",a:{kind:"rice",v:"plate",base:"#c98a3a",dots:["#4a2c4a","#d9a04f","#f4f1e8"],leaf:"#4f9a45"},d:"An upside-down pot of spiced rice, chicken and fried vegetables, flipped onto a tray at the table. The name means upside down.",i:"1 kg chicken pieces|1 onion|1 cinnamon stick|4 cardamom pods|1 aubergine, sliced|1/2 cauliflower, in florets|2 potatoes, sliced|400 g long-grain rice, soaked for 30 minutes|2 tsp seven spice (baharat)|1 tsp turmeric|Oil for frying|40 g toasted almonds or pine nuts|Plain yogurt, to serve",p:"Simmer the chicken with the onion, cinnamon, cardamom and salt in 1.5 l water for 40 minutes, and keep the broth.|Fry the aubergine, cauliflower and potatoes until golden.|In a deep pot, layer the chicken, then the vegetables, then the drained rice mixed with the spices. Pour over hot broth to cover by 2 cm.|Cover and cook on low for 30 minutes, rest for 10, then flip the pot onto a large tray. Top with the nuts and serve with yogurt."},
  {id:"me-musakhan",t:"Musakhan",k:"Mains",m:75,s:4,r:"Palestine",a:{kind:"chunks",v:"plate",dots:["#8a3b6a","#c98a3a","#d9a04f"],leaf:"#4f9a45"},d:"Palestine's national dish: roast chicken on olive-oil-soaked flatbread, piled with sweet onions and tart, crimson sumac.",i:"1.2 kg chicken pieces|2 tbsp sumac, plus extra|1 tsp seven spice (baharat)|1 tsp ground cumin|120 ml olive oil|4 onions, thinly sliced|4 taboon or large flatbreads|40 g pine nuts, toasted",p:"Rub the chicken with half the sumac, the spices, salt and a little oil, and roast at 200°C for 45 minutes.|Cook the onions slowly in the rest of the oil with the remaining sumac and some salt for 25 minutes, until soft and purple.|Brush the breads with the onion oil, spread with the onions and top with the chicken.|Warm in the oven for 5 minutes and finish with pine nuts and more sumac."},
  {id:"me-hummus",diet:"Vegan",t:"Hummus",k:"Starters",m:20,s:6,r:"Levant",a:{kind:"soup",v:"bowl",base:"#e9d9a6",dots:["#c0392b","#d9a04f","#4f9a45"]},d:"Silky chickpea and tahini dip. The trick is warm chickpeas and a splash of ice water for the fluffiest texture.",i:"400 g cooked chickpeas, warm|100 g tahini|1 lemon, juiced|1 small clove garlic|1 pinch ground cumin|4 tbsp ice-cold water|Olive oil, paprika and parsley, to serve",p:"Blend the warm chickpeas with the garlic and lemon juice until crumbly.|Add the tahini and cumin and blend, then add the ice water a spoonful at a time until very smooth and fluffy.|Season with salt.|Swirl into a bowl and finish with oil, paprika, a few whole chickpeas and parsley."},
  {id:"me-falafel",diet:"Vegan",t:"Falafel",k:"Starters",m:40,s:4,r:"Levant",a:{kind:"chunks",v:"plate",dots:["#6b4a2a","#7a5a2a","#5a4020"],leaf:"#7fb069"},d:"Crisp, herby fritters made from soaked raw chickpeas. Start soaking the night before.",i:"250 g dried chickpeas, soaked overnight|1 small onion|3 cloves garlic|1 large handful parsley|1 large handful coriander|1 tsp ground cumin|1 tsp ground coriander|1/2 tsp baking soda|1 tsp salt|Oil for frying|Pita, tahini sauce and salad, to serve",p:"Drain the soaked chickpeas well. They must be raw, not cooked.|Pulse them with the onion, garlic, herbs, spices and salt into a coarse green mixture, then stir in the baking soda.|Shape small patties and fry at 175°C for 3 to 4 minutes, until deep brown and crisp.|Serve in pita with tahini sauce and salad."},
  {id:"me-fattoush",diet:"Vegan",t:"Fattoush",k:"Salads",m:20,s:4,r:"Lebanon",a:{kind:"salad",dots:["#7fb069","#d9412b","#d9a04f","#a23b72","#4f9a45"]},d:"A crunchy chopped salad with toasted pitta, herbs, sumac and a tangy pomegranate molasses dressing.",i:"2 pitta breads|7 tbsp olive oil|1 cucumber|3 tomatoes|1 romaine lettuce|6 radishes|3 spring onions|1 handful mint|1 handful parsley|1 lemon, juiced|1 tbsp pomegranate molasses|2 tsp sumac",p:"Tear the pitta into pieces, toss with 3 tbsp of the oil and bake at 200°C for 8 minutes until crisp.|Chop the vegetables and herbs into bite-sized pieces.|Whisk the lemon juice, pomegranate molasses, sumac, remaining oil and salt.|Toss everything together just before serving so the bread stays crunchy."},
  {id:"me-baba",diet:"Vegan",t:"Baba ghanoush",k:"Starters",m:45,s:4,r:"Levant",a:{kind:"soup",v:"bowl",base:"#b8a080",dots:["#c0392b","#4f9a45","#f4f1e8"]},d:"Smoky charred aubergine mashed with tahini, lemon and garlic.",i:"2 large aubergines|3 tbsp tahini|1 lemon, juiced|1 clove garlic, crushed|2 tbsp olive oil|Pomegranate seeds and parsley, to serve",p:"Char the aubergines over a gas flame or under a hot grill, turning, until collapsed and smoky, about 20 minutes.|Cool, scoop out the flesh and let it drain in a sieve for 10 minutes.|Mash with the tahini, lemon juice, garlic and salt.|Spread in a bowl, drizzle with oil and top with pomegranate and parsley."},
  {id:"me-mujaddara",diet:"Vegan",t:"Mujaddara",k:"Mains",m:50,s:4,r:"Levant",a:{kind:"rice",v:"plate",base:"#7a5a3a",dots:["#5a3a1e","#d9a04f","#8a5a2b"]},d:"Lentils and rice cooked together and crowned with a tangle of deeply browned, crispy onions. Humble and addictive.",i:"200 g brown or green lentils|200 g long-grain rice|4 onions, thinly sliced|100 ml olive oil|1 tsp ground cumin|1 tsp salt|Salad or yogurt, to serve",p:"Boil the lentils for 15 minutes until almost tender, then drain.|Fry the onions slowly in the oil until deep brown and crisp, and lift out half for the top.|Add the rice, cumin, salt and lentils to the remaining onions with 500 ml water, cover and cook on low for 20 minutes.|Fluff with a fork, top with the crispy onions and serve with salad or yogurt."},
  {id:"me-shawarma",t:"Chicken shawarma",k:"Mains",m:45,s:4,r:"Levant",a:{kind:"chunks",v:"plate",dots:["#c97a3a","#d9a04f","#b8662b"],leaf:"#4f9a45"},d:"Spiced, yogurt-marinated chicken roasted until charred, sliced thin and wrapped in flatbread with garlic sauce and pickles. Marinate for an hour first.",i:"800 g chicken thighs|4 tbsp yogurt|2 tbsp olive oil|1 lemon, juiced|3 cloves garlic, grated|2 tsp ground cumin|2 tsp paprika|1 tsp turmeric|1/2 tsp cinnamon|4 flatbreads|Garlic sauce, pickles, tomato and parsley, to serve",p:"Mix the yogurt, oil, lemon juice, garlic and spices with salt and coat the chicken. Marinate for at least 1 hour.|Roast at 220°C for 25 minutes, then grill for a few minutes to char.|Rest the chicken and slice it thinly.|Wrap in flatbreads with garlic sauce, pickles, tomato and parsley."},
  {id:"me-knafeh",diet:"Vegetarian",t:"Knafeh",k:"Desserts",m:60,s:8,r:"Nablus",a:{kind:"slice",layers:["#f4f1e8","#f08a2a"],top:"#e07b39"},d:"Nablus's famous dessert: crisp shredded pastry over a layer of melting sweet cheese, soaked in orange blossom syrup. Best eaten warm.",i:"250 g kataifi pastry|120 g butter, melted|300 g akkawi or mozzarella, soaked to remove the salt|200 g ricotta|200 g sugar|150 ml water|1 tsp lemon juice|1 tsp orange blossom water|30 g pistachios, chopped",p:"Simmer the sugar, water and lemon juice for 8 minutes, add the orange blossom water and cool.|Chop the kataifi, mix with the butter and press half of it firmly into a 26 cm pan.|Mix the drained cheese with the ricotta, spread it over, and cover with the rest of the pastry.|Bake at 190°C for 35 minutes until golden, flip onto a plate, pour over the syrup and scatter with pistachios."},
  {id:"me-tabbouleh",diet:"Vegan",t:"Tabbouleh",k:"Salads",m:20,s:4,r:"Lebanon",a:{kind:"salad",dots:["#4f9a45","#3f7a2c","#d9412b","#f4f1e8"]},d:"A bright parsley salad with a little bulgur, tomato, mint and plenty of lemon. More herbs than grain.",i:"50 g fine bulgur|3 large bunches parsley, finely chopped|1 handful mint, finely chopped|4 tomatoes, finely diced|4 spring onions, sliced|2 lemons, juiced|5 tbsp extra virgin olive oil|1/2 tsp allspice",p:"Soak the bulgur in the juice of 1 lemon and a little water for 15 minutes.|Chop the herbs very finely with a sharp knife.|Mix everything with the oil, remaining lemon juice, allspice and salt.|Serve straight away. It should be mostly green, with just a little bulgur."},
  {id:"me-freekeh",t:"Freekeh soup",k:"Soups",m:50,s:4,r:"Palestine",a:{kind:"soup",v:"bowl",base:"#b8783a",dots:["#6b5030","#4f9a45","#f4f1e8"]},d:"A comforting Palestinian soup of smoky green wheat and chicken, often served during Ramadan.",i:"1 tbsp olive oil|1 onion, chopped|300 g chicken thighs, diced|1 tsp seven spice (baharat)|150 g cracked freekeh, rinsed|1.5 l chicken stock|1 lemon|1 handful parsley",p:"Soften the onion in the oil, add the chicken and spices and brown lightly.|Add the freekeh and stock and simmer for 35 minutes until tender.|Season and stir in lemon juice to taste.|Serve topped with parsley."}
];

/* Healthy bowls and everyday breakfasts and desserts (h:1 puts a dish in the Healthy section) */
const EVERYDAY = [
  // Healthy
  {id:"x-protein-bowl",h:1,t:"High-protein chicken bowl",k:"Mains",m:35,s:2,a:{kind:"rice",v:"bowl",base:"#c9a46a",dots:["#e9c27a","#3f8f3a","#7fb069","#f4f1e8","#d9412b"],leaf:"#4f9a45"},d:"Juicy spiced chicken breast over brown rice with edamame, broccoli and a creamy Greek yogurt and lemon sauce. Around 45 g of protein per bowl.",i:"350 g chicken breasts (about 2)|1 tbsp olive oil|1 tsp smoked paprika|1/2 tsp garlic powder|120 g brown rice|150 g broccoli, in small florets|100 g frozen edamame beans|1/2 cucumber, sliced|150 g Greek yogurt|1/2 lemon, juiced|1 tbsp chopped dill or parsley",p:"Get the rice going first: rinse it, then simmer it in plenty of salted water for about 25 minutes until tender, and drain it well.|While it cooks, flatten the chicken breasts a little with your palm so they cook evenly, then rub them with the oil, paprika, garlic powder and a good pinch of salt.|Cook the chicken in a hot pan for 5 to 6 minutes a side, until golden outside and no longer pink in the middle. Let it rest for 5 minutes before slicing, so the juices stay inside.|For the last 4 minutes of the rice, drop the broccoli and edamame into the same pot so everything is ready together.|Stir the yogurt with the lemon juice, herbs and a pinch of salt to make the sauce.|Divide the rice, greens and cucumber between two bowls, lay the sliced chicken on top and spoon over the yogurt sauce."},
  {id:"x-med-salad",h:1,diet:"Vegetarian",t:"Healthy Mediterranean salad",k:"Salads",m:15,s:4,a:{kind:"salad",dots:["#d9412b","#7fb069","#f4f1e8","#3a2a3a","#f2d58a"]},d:"A big, crunchy salad of tomatoes, cucumber, peppers, chickpeas, olives and feta in a lemon and oregano dressing. Filling enough to eat as a meal.",i:"300 g cherry tomatoes, halved|1 cucumber, in chunks|1 yellow pepper, diced|1/2 red onion, thinly sliced|400 g canned chickpeas, drained|60 g kalamata olives|100 g feta|1 small romaine lettuce, chopped|3 tbsp extra virgin olive oil|1 lemon, juiced|1 tsp dried oregano|1 handful parsley, chopped",p:"Put the sliced red onion in a small bowl with the lemon juice and a pinch of salt and leave it for 5 minutes. This takes away the harsh bite.|Meanwhile, chop the tomatoes, cucumber and pepper into bite-sized pieces and put them in a large bowl with the lettuce, chickpeas and olives.|Whisk the oil and oregano into the onion and lemon juice to make the dressing.|Pour the dressing over the salad, add the parsley and toss everything together well.|Crumble the feta over the top and serve straight away."},
  {id:"x-salmon-bowl",h:1,t:"Garlic salmon rice bowl",k:"Mains",m:30,s:2,a:{kind:"rice",v:"bowl",base:"#f0ece2",dots:["#f08a5d","#7fb069","#3f8f3a","#2b2b2b","#f4f1e8"],leaf:"#4f9a45"},d:"Salmon glazed in garlic, honey and soy, served over fluffy rice with avocado, cucumber and spinach. Quick, balanced and full of omega-3.",i:"250 g salmon fillets (2 fillets)|150 g jasmine or basmati rice|3 cloves garlic, finely chopped|2 tbsp soy sauce|1 tbsp honey|1 tsp rice vinegar|1 tsp olive oil|1 avocado, sliced|1/2 cucumber, sliced|1 handful baby spinach|1 tsp sesame seeds|2 spring onions, sliced",p:"Rinse the rice until the water runs almost clear, then cook it with 1½ times its volume of water, covered, on low heat for 12 minutes. Turn off the heat and leave it covered for 10 minutes more.|Mix the garlic, soy sauce, honey and vinegar in a small bowl.|Pat the salmon dry and season it lightly. Heat the oil in a non-stick pan and cook the salmon skin side down for 4 minutes, until the skin is crisp, then turn it over.|Pour in the garlic sauce and let it bubble for 2 to 3 minutes, spooning it over the fish, until it turns sticky and the salmon is just cooked in the middle.|Fill the bowls with rice, spinach, avocado and cucumber, add the salmon and pour over any glaze left in the pan.|Finish with sesame seeds and spring onions."},
  {id:"x-quinoa-bowl",h:1,diet:"Vegan",t:"Easy quinoa and vegetable bowl",k:"Mains",m:35,s:2,a:{kind:"rice",v:"bowl",base:"#e9dcb8",dots:["#e98a2a","#d9412b","#3f8f3a","#a23b72","#f2d58a"],leaf:"#4f9a45"},d:"Fluffy quinoa with roasted sweet potato, peppers and courgette, chickpeas and a creamy lemon tahini dressing. Plant-based and great for meal prep.",i:"120 g quinoa|1 sweet potato, in cubes|1 red pepper, in chunks|1 courgette, in half-moons|200 g canned chickpeas, drained|1 tbsp olive oil|1 tsp ground cumin|1 handful baby spinach|2 tbsp tahini|1/2 lemon, juiced|1 tsp maple syrup|2 tbsp warm water",p:"Heat the oven to 220°C. Toss the sweet potato, pepper, courgette and chickpeas with the oil, cumin and salt, spread them out on a tray and roast for 25 minutes, turning once, until golden at the edges.|Meanwhile, rinse the quinoa well in a sieve, which removes its bitter coating. Simmer it in 240 ml salted water, covered, for 15 minutes, then leave it covered off the heat for 5 minutes and fluff it with a fork.|Whisk the tahini, lemon juice and maple syrup, then add the warm water a little at a time until the dressing is smooth and pourable. Season with salt.|Divide the quinoa between two bowls with the spinach, pile the roasted vegetables on top and drizzle with the tahini dressing."},
  {id:"x-chicken-wrap",h:1,t:"Healthy chicken wrap",k:"Mains",m:25,s:4,a:{kind:"wrap",dots:["#e9c27a","#7fb069","#d9412b","#f4f1e8"]},d:"Lightly spiced grilled chicken rolled in wholemeal wraps with crisp salad and a garlic yogurt sauce. Lunch you can eat with one hand.",i:"350 g chicken breasts (about 2)|1 tbsp olive oil|1 tsp ground cumin|1 tsp paprika|4 large wholemeal wraps|1 small romaine lettuce, shredded|2 tomatoes, sliced|1/2 cucumber, in sticks|1/2 red onion, thinly sliced|150 g Greek yogurt|1 small clove garlic, grated|1/2 lemon, juiced",p:"Cut the chicken breasts in half through the middle so you have thin pieces that cook fast. Rub them with the oil, cumin, paprika and salt.|Cook them in a hot griddle or frying pan for 3 to 4 minutes a side, until browned and cooked through, then rest for a few minutes and slice into strips.|Stir the yogurt with the garlic, lemon juice and a pinch of salt.|Warm the wraps in a dry pan for a few seconds each side so they're soft and don't crack.|Spread each wrap with sauce, add lettuce, tomato, cucumber, onion and chicken in a line down the middle, then fold in the bottom and roll it up tightly. Cut in half to serve."},
  {id:"x-greek-prep",h:1,t:"Greek chicken meal prep",k:"Mains",m:45,s:4,a:{kind:"rice",v:"plate",base:"#f0ece2",dots:["#e9c27a","#d9412b","#7fb069","#3a2a3a","#f4f1e8"],leaf:"#4f9a45"},d:"Lemon, garlic and oregano chicken with rice, a crunchy Greek salad and tzatziki, packed into four lunch boxes for the week ahead.",i:"600 g chicken breast, in chunks|2 tbsp olive oil|1 lemon, juiced|2 cloves garlic, grated|2 tsp dried oregano|200 g long-grain rice|250 g cherry tomatoes, halved|1 cucumber|1/2 red onion, finely chopped|40 g kalamata olives|80 g feta|200 g Greek yogurt|1 tbsp chopped dill",p:"Mix the oil, half the lemon juice, the garlic, oregano and salt in a bowl, add the chicken and leave it for at least 15 minutes, or overnight in the fridge.|Cook the rice: simmer it in 400 ml salted water, covered, for 12 minutes, then rest it off the heat for 10 minutes.|Heat the oven to 220°C. Spread the chicken out on a lined tray and roast for 18 to 20 minutes, until golden and cooked through.|Grate half the cucumber, squeeze out the water with your hands and stir it into the yogurt with the dill, the rest of the lemon juice and a pinch of salt. That's your tzatziki.|Dice the rest of the cucumber and toss it with the tomatoes, onion, olives and crumbled feta.|Let everything cool, then divide it between four containers, keeping the tzatziki in a small pot on the side so nothing goes soggy."},
  // Breakfast and desserts
  {id:"x-pancakes",diet:"Vegetarian",t:"Fluffy American pancakes",k:"Breakfast",m:25,s:4,a:{kind:"stack",berries:1},d:"Thick, soft pancakes that rise tall in the pan, served with butter, maple syrup and berries. The secret is a lumpy batter and a short rest.",i:"200 g plain flour|2 tsp baking powder|1/2 tsp baking soda|2 tbsp sugar|1 pinch salt|300 ml milk|1 tbsp lemon juice|1 egg|30 g butter, melted, plus extra for the pan|Maple syrup and berries, to serve",p:"Stir the lemon juice into the milk and leave it for 5 minutes. It will thicken slightly, like buttermilk, which makes the pancakes lighter.|In a big bowl, mix the flour, baking powder, baking soda, sugar and salt.|Whisk the egg and melted butter into the milk, then pour it into the dry ingredients and stir gently with a fork until just combined. Stop while there are still small lumps: overmixing makes pancakes flat and tough.|Leave the batter to rest for 5 to 10 minutes while the pan heats up over medium-low heat.|Wipe the pan with a little butter, pour in about 3 tbsp of batter per pancake and cook until bubbles appear on top and the edges look set, about 2 minutes. Flip and cook for 1 minute more.|Keep them warm in a low oven while you cook the rest, then stack them up with butter, maple syrup and berries."},
  {id:"x-overnight-oats",diet:"Vegetarian",t:"Easy overnight oats",k:"Breakfast",m:5,s:1,a:{kind:"glass",base:"#e9dcc0",top:"#c0392b"},d:"Oats soaked overnight in milk and yogurt with chia, so breakfast is waiting in the fridge. Top with fruit, nuts or a spoon of peanut butter.",i:"50 g rolled oats|1 tbsp chia seeds|120 ml milk|60 g Greek yogurt|1 tsp honey or maple syrup|1 pinch cinnamon|1 handful berries|1 tbsp chopped almonds",p:"Put the oats, chia seeds and cinnamon in a jar or container with a lid.|Pour in the milk, add the yogurt and honey and stir well, making sure no dry oats are stuck at the bottom.|Close the lid and leave it in the fridge overnight, or for at least 4 hours. The oats and chia soak up the liquid and turn soft and creamy.|In the morning give it a stir, loosen with a splash of milk if it's too thick, and top with berries and almonds. Eat it cold or warm it for a minute in the microwave."},
  {id:"x-banana-bread",diet:"Vegetarian",t:"Homemade banana bread",k:"Baking",m:75,s:10,a:{kind:"loaf",base:"#a8652f"},d:"A moist, tender loaf with a golden crust, sweetened mostly by very ripe bananas. Even better the next day.",i:"3 very ripe bananas|80 g butter, melted|120 g brown sugar|1 egg|1 tsp vanilla extract|1 tsp baking soda|1 pinch salt|190 g plain flour|1/2 tsp cinnamon|50 g walnuts, chopped (optional)",p:"Heat the oven to 175°C and line a 900 g (2 lb) loaf tin with baking paper.|Mash the bananas in a large bowl with a fork until mostly smooth. The blacker the skins, the sweeter and more fragrant the bread will be.|Stir in the melted butter, then the sugar, egg and vanilla.|Sprinkle over the baking soda, salt and cinnamon, then fold in the flour (and the walnuts, if using) until no dry flour is left. Don't beat it: a gentle mix keeps the crumb soft.|Pour into the tin and bake for 55 to 65 minutes, until a skewer pushed into the centre comes out clean. If the top browns too fast, cover it loosely with foil.|Let it cool in the tin for 10 minutes, then lift it out onto a rack. Wait until it's cool before slicing, so it doesn't crumble."},
  {id:"x-brownies",diet:"Vegetarian",t:"Classic chocolate brownies",k:"Desserts",m:45,s:16,a:{kind:"slice",layers:["#4a2c1d","#3a2416","#4a2c1d"],top:"#2a1a10"},d:"Fudgy, dense brownies with a shiny, crackly top. Take them out while the middle is still slightly soft.",i:"200 g dark chocolate (70%), chopped|175 g butter|250 g sugar|3 eggs|1 tsp vanilla extract|90 g plain flour|40 g cocoa powder|1/2 tsp salt",p:"Heat the oven to 180°C and line a 20 x 20 cm tin with baking paper.|Melt the chocolate and butter together in a bowl over a pan of barely simmering water, or in short bursts in the microwave. Stir until smooth and let it cool for a few minutes.|In another bowl, whisk the sugar, eggs and vanilla hard for 3 to 4 minutes until pale and thick. This is what gives brownies their shiny, crackly top.|Pour in the chocolate and fold it through, then sift over the flour, cocoa and salt and fold gently until just combined.|Spread into the tin and bake for 22 to 25 minutes. The top should look set and cracked, but a skewer in the middle should come out with a few moist crumbs.|Leave to cool completely in the tin, ideally chilling for an hour, before cutting into 16 squares. They cut much more neatly once cold."},
  {id:"x-cheesecake",diet:"Vegetarian",t:"No-bake cheesecake",k:"Desserts",m:30,s:10,a:{kind:"slice",layers:["#f6ecd2","#f6ecd2","#f3e4c0","#c9955a"],top:"#c0392b"},d:"A creamy, lightly lemony cheesecake on a buttery biscuit base, set in the fridge with no oven needed. Allow 6 hours to chill.",i:"250 g digestive biscuits|100 g butter, melted|600 g full-fat cream cheese, at room temperature|100 g icing sugar|1 tsp vanilla extract|1 lemon, zest and juice|300 ml double cream|200 g berries or berry compote, to serve",p:"Crush the biscuits to fine crumbs in a food processor, or in a bag with a rolling pin. Mix them with the melted butter until they look like wet sand.|Press the crumbs firmly into the base of a 23 cm springform tin, using the bottom of a glass to pack them down. Chill while you make the filling.|Beat the cream cheese with the icing sugar, vanilla, lemon zest and juice until smooth.|In another bowl, whip the cream to soft peaks, then fold it into the cream cheese until there are no streaks.|Spread the filling over the base, smooth the top and chill for at least 6 hours, or overnight, until firm.|Run a warm knife around the edge before opening the tin, and serve topped with berries."},
  {id:"x-mousse",diet:"Vegetarian",t:"Easy homemade chocolate mousse",k:"Desserts",m:20,s:6,a:{kind:"glass",base:"#4a2c1d",top:"#6b3f28"},d:"Airy, rich chocolate mousse made with just dark chocolate, eggs, a little sugar and cream. Needs 3 hours in the fridge.",i:"150 g dark chocolate (70%), chopped|20 g butter|3 eggs, separated|30 g sugar|150 ml double cream|1 pinch salt",p:"Melt the chocolate and butter together over a pan of barely simmering water, stir until smooth and leave to cool for 5 minutes, until just warm.|Stir the egg yolks into the chocolate one at a time.|Whip the cream to soft peaks and fold it into the chocolate.|In a very clean bowl, whisk the egg whites with the salt until foamy, then add the sugar a little at a time and keep whisking until you have soft, glossy peaks.|Fold a third of the whites into the chocolate to loosen it, then gently fold in the rest with a big spoon, lifting from the bottom, until no white streaks remain. Go slowly so you keep the air in.|Spoon into glasses and chill for at least 3 hours, until set. Because the eggs are raw, use the freshest eggs you can find."}
];
HOUSE.push(...EVERYDAY.map(e => ({id:e.id, title:e.t, course:"", category:e.k, time:e.m, serves:e.s, region:"", cuisine:"",
  diet:e.diet || "", healthy:!!e.h, summary:e.d, ingredients:e.i.split("|"), steps:e.p.split("|"), art:e.a, house:true})));

/* Fuller, friendlier methods (replace the short steps for these recipes) */
const LONG_STEPS = {
  "h-aglio":["Bring a large pot of water to the boil and salt it well, so it tastes pleasantly of the sea. Cook the spaghetti until it still has a firm bite in the centre, about 2 minutes less than the packet says, and scoop out a big mug of the cloudy cooking water before you drain.","While the pasta cooks, pour the oil into a wide, cold frying pan and add the sliced garlic. Warm it over low heat so the garlic sizzles gently and turns pale gold, about 4 minutes. Don't let it brown: dark garlic tastes bitter. Stir in the chili flakes for the last few seconds.","Lift the spaghetti straight into the pan with tongs and add a splash of the pasta water. Toss hard over medium heat for a minute or two. The starch in the water and the oil come together into a glossy sauce that clings to every strand, so add more water if it looks dry.","Take the pan off the heat, scatter over the parsley, taste and add salt if needed. Serve straight away, while it's silky."],
  "h-carbonara":["Cut the guanciale into short strips about the thickness of a pencil. Put them in a cold, dry frying pan and cook over medium-low heat, so the fat melts out slowly and the edges turn crisp and golden, about 8 minutes. Take the pan off the heat and keep the fat in it: it's part of the sauce.","In a bowl, whisk the egg yolks with most of the pecorino and a generous grinding of black pepper until you have a thick, sunny paste.","Cook the spaghetti in well-salted boiling water until al dente, and save a mug of the cooking water before draining.","Tip the spaghetti into the guanciale pan, still off the heat, and toss to coat it in the fat. Let it sit for 30 seconds so it's hot but not scorching, then add the yolk mixture and a splash of pasta water.","Toss quickly and keep everything moving, adding more water a spoonful at a time, until the eggs thicken into a creamy, glossy sauce. If the pan is too hot the eggs will scramble, so go slowly. Serve at once with the rest of the pecorino and more pepper."],
  "h-amatriciana":["Cut the guanciale into thick strips and render it slowly in a wide pan over medium-low heat, until the fat runs and the strips turn golden, about 8 minutes. Crumble in the chili and let it sizzle for a few seconds.","Pour in the wine and let it bubble for a minute or two, scraping the bottom of the pan, until the sharp smell of alcohol fades.","Lift out the guanciale with a slotted spoon and set it aside so it stays crisp. Add the tomatoes to the fat, crush them with a wooden spoon and simmer for about 15 minutes, until the sauce is thick and glossy.","Meanwhile, cook the bucatini in salted boiling water until al dente. Drain, keeping a little of the water.","Stir the guanciale back into the sauce, add the pasta and toss over the heat for a minute, loosening with pasta water if needed. Take it off the heat, add the pecorino, toss again and serve."],
  "h-milanese":["Crumble the saffron threads into a ladle of the hot stock and leave them to steep, so they release their colour and aroma. Keep the rest of the stock at a gentle simmer on the back of the stove.","Melt half the butter in a wide, heavy pan over low heat and cook the onion slowly for about 5 minutes, until soft and translucent but not browned.","Add the rice and stir for 2 minutes, until the grains look glassy at the edges and feel hot to the touch. This toasting helps them hold their shape.","Pour in the wine and stir until it has almost all evaporated.","Add a ladle of hot stock and stir until it's mostly absorbed, then add the next. Keep going for 16 to 18 minutes, stirring often, and add the saffron stock halfway through. The risotto is ready when the rice is tender with a slight bite and the texture is loose and creamy.","Off the heat, beat in the remaining cold butter and the Parmigiano. Cover and rest for 2 minutes, then serve: it should spread slowly across the plate in a wave."],
  "h-pesto":["Put the garlic and a pinch of coarse salt in a large mortar and pound them into a creamy paste. Add the pine nuts and keep working until smooth.","Add the basil a handful at a time. Instead of beating, press and grind the leaves against the side of the mortar in a circular motion. This crushes them gently and keeps the pesto bright green instead of dark and bitter.","Stir in both cheeses, then pour in the oil in a thin stream, mixing as you go, until the pesto is thick but spoonable.","Cook the trofie in salted boiling water until al dente, and keep a little of the water.","Drain the pasta and toss it in a bowl with the pesto and a spoonful of cooking water to loosen it. Don't put the pesto over heat, or the basil will darken and lose its fresh flavour."],
  "h-parmigiana":["Slice the aubergines lengthways about 5 mm thick, sprinkle them with salt and leave them in a colander for an hour. This draws out bitter juices and stops them soaking up too much oil. Pat the slices dry with kitchen paper.","Meanwhile, warm the olive oil with the garlic, add the passata and a few basil leaves, and simmer gently for 20 minutes until slightly thickened. Season with salt.","Heat the sunflower oil in a deep pan and fry the aubergine slices in batches until golden on both sides. Drain them on kitchen paper.","Heat the oven to 200°C. Spread a little sauce in a baking dish, then add a layer of aubergine, more sauce, mozzarella, Parmigiano and torn basil. Repeat until everything is used, finishing with sauce and a good layer of Parmigiano.","Bake for about 40 minutes, until bubbling at the edges and golden on top. Let it rest for at least 20 minutes before cutting, so the layers set and slice cleanly."],
  "h-tiramisu":["Separate the eggs. Whisk the yolks with half the sugar until pale, thick and doubled in volume, then add the mascarpone and beat gently until smooth and creamy.","In a very clean bowl, whisk the whites with the remaining sugar until they hold firm, glossy peaks. Fold them into the mascarpone in two or three batches with a spatula and a light hand, so you keep the air in.","Pour the cooled espresso into a shallow dish. Dip each savoiardo in it for about a second on each side: long enough to soak the outside, not so long that it falls apart. Lay them snugly in your dish.","Spread half the cream over the biscuits, add another layer of dipped savoiardi, then cover with the rest of the cream and smooth the top.","Cover and chill for at least 4 hours, or overnight, so the biscuits soften and the flavours settle. Dust generously with cocoa just before serving."],
  // Antipasti
